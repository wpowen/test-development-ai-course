<title id="title">完整测试方案四层架构与投影链</title>
<desc id="desc">契约与门禁约束方法论，方法论产生内容源，内容源经两个生成器投影成站点模块与 Markdown 文档，再经八道门禁形成发布候选；外部验证证据保持 NOT_RUN。</desc>

