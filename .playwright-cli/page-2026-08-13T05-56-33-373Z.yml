      - generic [ref=e685]:
        - generic [ref=e686]: "02"
        - generic [ref=e687]:
          - heading "TD-AG-00 Wave6 架构专属决策" [level=2] [ref=e688]
          - paragraph [ref=e689]: AG00 专属总览决策：先把 Agent 拆成输入、模型、状态、工具、Worker、Judge、人工和业务结果八类节点，再为每个节点登记 D0–D7 风险。D0 问评估器是否可信，D1 问单步和轨迹是否安全，D2 问交接是否隔离，D3 问人能否中断，D4 问重复运行是否稳定，D5 问攻击是否被硬控制阻断，D6 问预算是否守恒，D7 问业务责任是否可追溯。
          - paragraph [ref=e690]: 架构图工作法：每条箭头都标注输入格式、状态持有者、信任边界、可逆性和失败出口；没有箭头 owner 的节点不算完成。将最终文本与副作用分开画，避免把“回答正确”误认为“写操作安全”。
          - paragraph [ref=e691]: D0 到 D7 不是八个孤立章节：一个过期 Judge 会污染 D4 的可靠性趋势，一个 D2 handoff 泄漏会升级为 D5 租户风险，一个 D6 无限重试会制造 D3 人工接管疲劳。学习者必须在图上画出至少两条跨维度级联边，并为每条边指定首个 Oracle。
          - paragraph [ref=e692]: 四环决策：离线环只验证确定性 fixture 和架构字段，沙箱环验证真实工具隔离与回滚，影子环验证真实人口分布，在线环才讨论持续 SLO。任何环没有 entry、exit、hard blocker、owner、rollback 和 not-run reason，都只能标 EVIDENCE-INSUFFICIENT。
          - paragraph [ref=e693]: 总览工件：交付 agent-boundary-map.svg、d0-d7-risk-ledger.json、four-ring-entry-exit.md、owner-escalation.csv 和 unknown-register.md。迁移到代码、客服或金融 Agent 时只复用字段，不复用风险结论、阈值或 receipt。
          - paragraph [ref=e694]: 故障诊断：若图上所有风险都连接到模型输出，先检查是否遗漏工具参数、状态快照、权限、队列和人工决定；若四环都显示 PASS，检查是否把 fixture-only 写成 live。修复是补节点和边，再重跑最小 mutation，不是增加页面或综合分。
          - paragraph [ref=e695]: 小白复盘：用四句话解释测什么、谁判断、哪里停、下一份证据交给谁；再指出哪些结论只属于离线环。回答不了时写 UNKNOWN，并将下一步交给架构 owner、工具 owner 或业务 owner，而不是让模型自行批准。
          - paragraph [ref=e696]: 架构评审演练：从客服 Agent 的一次退款请求开始，先在系统边界标出用户身份、会话状态、检索索引、模型推理、工具授权、队列 Worker、Judge 和业务账本；随后沿每条边写数据格式、权限、超时、幂等键与回滚。若输出文本正确但工具账本出现第二次退款，D1 结果和 D5 副作用门禁必须同时变红，D0 的 Judge 分不能抵消它。
          - paragraph [ref=e697]: 总览验收不是背诵八个域，而是提交一张可复核的 cross-domain decision sheet：每个 D0–D7 域至少连接一个风险、一个观察点、一个独立 Oracle、一个 mutation、一个 stop state 和一个 owner。缺少真实工具、企业身份或线上人口时，相应节点保留 NOT_RUN；不得用离线 fixture 的箭头替代沙箱、影子或在线环证据。
      - generic [ref=e698]:
        - generic [ref=e699]: "03"
        - generic [ref=e700]:
          - heading "TD-AG-00 专属案例推演与迁移" [level=2] [ref=e701]
          - paragraph [ref=e702]: TD-AG-00 的练习从这个具体故障开始：客服退款系统由路由器、Agent、检索器、工具、异步 Worker 和人工审批组成。最终答复看起来正确，但一次未经授权的写操作可能已经发生。。先把它写成 Evidence（输入、trace、状态快照和版本），再写 Inference（为什么只能定位到 Agent 测试架构总览：先画边界，再选测试 的风险），最后列出 Unknown（哪些真实条件没有运行）。
          - paragraph [ref=e703]: 对 TD-AG-00，学员必须在 需求/风险、D0 评估可信、D1 单体、D2 编排、D3 人机、D4 可靠、D5 安全、D6 效率、D7 治理、四证据环、护栏、决策/反馈 中选出首个可观察断点，明确由谁拥有 Oracle、谁拥有停止权，以及故障从哪里开始影响用户或业务；只看最终文本不能替代过程证据。
          - paragraph [ref=e704]: 职业实验要求先预测 TD-AG-00 的 fault：若图只有组件名称或把所有检查挂到模型输出，说明被测边界仍不清楚；不能用页面数量补救。；再运行同一个 fixture 的 baseline、fault、repair，保留 failed_oracle_ids、退出码、输入 hash 和 reviewer，而不是修改 expected 或删掉失败样本。
          - paragraph [ref=e705]: 迁移 TD-AG-00 时，保留“Agent 测试架构总览：先画边界，再选测试”的风险主线，但必须替换数据、权限、工具、业务错误成本、owner、回滚和适用范围。新系统中的模型、集成、从业者复核、学习者迁移、live 与 production 证据不能继承本页 receipt。
          - paragraph [ref=e706]: 完成标准是能用小白语言回答四问：测什么、谁判断、哪里停、下一份证据交给谁；答不出时写 UNKNOWN，并把 补齐状态持有者、工具副作用、独立 Oracle、owner 和停止状态，再用同一 fixture 重放。 拆成下一条可执行任务。
