        - generic [ref=e679]:
          - heading "先把架构问题说清楚" [level=2] [ref=e680]
          - paragraph [ref=e681]: 客服退款系统由路由器、Agent、检索器、工具、异步 Worker 和人工审批组成。最终答复看起来正确，但一次未经授权的写操作可能已经发生。
