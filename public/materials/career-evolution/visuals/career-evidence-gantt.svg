<title id="title">三个证据窗口各有退出条件</title><desc id="desc">用A/B/C窗口对比基线、故障和复评交付；课程30/60/90天是可编辑规划示例，不是测得工期或晋升时钟。 单位为顺序证据窗口；不按条长、日历坐标或百分比暗示实际进度 静态设计与 fixture 不证明个人能力、职级、晋升、就业或薪资；真实学习与组织效果 NOT_RUN，组织映射 INTERNAL-UNKNOWN。</desc><metadata data-source-ref="content/modules/career-evolution.ts#TD-C03 / workedExample;content/modules/career-evolution.ts#careerWave6Expansion / TD-C03">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;career-evidence-gantt&quot;,&quot;pageIds&quot;:[&quot;TD-C03&quot;],&quot;primaryPageIds&quot;:[],&quot;layout&quot;:&quot;comparison&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;content/modules/career-evolution.ts&quot;,&quot;locator&quot;:&quot;TD-C03 / workedExample&quot;,&quot;quote&quot;:&quot;60 天完成 RAG retrieval fault，90 天完成独立 Oracle 和复评&quot;},{&quot;path&quot;:&quot;content/modules/career-evolution.ts&quot;,&quot;locator&quot;:&quot;careerWave6Expansion / TD-C03&quot;,&quot;quote&quot;:&quot;60 天若 mutation 未打红，选择“回退到 Oracle 设计”&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;a&quot;,&quot;title&quot;:&quot;窗口 A：定基线&quot;},{&quot;id&quot;:&quot;b&quot;,&quot;title&quot;:&quot;窗口 B：做故障&quot;},{&quot;id&quot;:&quot;c&quot;,&quot;title&quot;:&quot;窗口 C：交付复评&quot;},{&quot;id&quot;:&quot;owner&quot;,&quot;title&quot;:&quot;owner 配置窗口&quot;},{&quot;id&quot;:&quot;stop&quot;,&quot;title&quot;:&quot;停止 / 回退 / 升级&quot;},{&quot;id&quot;:&quot;exit&quot;,&quot;title&quot;:&quot;证据出口&quot;},{&quot;id&quot;:&quot;next&quot;,&quot;title&quot;:&quot;下一轮计划&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;owner&quot;,&quot;to&quot;:&quot;a&quot;,&quot;label&quot;:&quot;定义窗口 A&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;owner&quot;,&quot;to&quot;:&quot;b&quot;,&quot;label&quot;:&quot;定义窗口 B&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;owner&quot;,&quot;to&quot;:&quot;c&quot;,&quot;label&quot;:&quot;定义窗口 C&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;a&quot;,&quot;to&quot;:&quot;exit&quot;,&quot;label&quot;:&quot;基线工件&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;b&quot;,&quot;to&quot;:&quot;exit&quot;,&quot;label&quot;:&quot;故障与修复收据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;c&quot;,&quot;to&quot;:&quot;exit&quot;,&quot;label&quot;:&quot;独立复评记录&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;b&quot;,&quot;to&quot;:&quot;stop&quot;,&quot;label&quot;:&quot;故障未被检出&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;c&quot;,&quot;to&quot;:&quot;stop&quot;,&quot;label&quot;:&quot;分歧未闭合&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;exit&quot;,&quot;to&quot;:&quot;next&quot;,&quot;label&quot;:&quot;按新增证据更新&quot;,&quot;kind&quot;:&quot;feedback&quot;},{&quot;from&quot;:&quot;stop&quot;,&quot;to&quot;:&quot;next&quot;,&quot;label&quot;:&quot;保留失败并重排&quot;,&quot;kind&quot;:&quot;feedback&quot;}]}</metadata>
<style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,monospace;letter-spacing:.25px}</style><defs><marker id="arr-data" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M0 0L12 6L0 12L3 6Z" fill="#215cbb"/></marker><marker id="arr-control" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M0 0L12 6L0 12L3 6Z" fill="#945c0b"/></marker><marker id="arr-evidence" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M0 0L12 6L0 12L3 6Z" fill="#7045a4"/></marker><marker id="arr-feedback" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M0 0L12 6L0 12L3 6Z" fill="#087b76"/></marker><marker id="arr-risk" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M0 0L12 6L0 12L3 6Z" fill="#ad3e4c"/></marker></defs>
<rect width="1600" height="1528" fill="#f4f7fb"/><rect width="10" height="174" fill="#215cbb"/>
<text x="64" y="53" font-size="18" fill="#215cbb" font-weight="750" class="mono">QUALITY ENGINEERING  /  career-evidence-gantt</text>
<text x="64" y="112" font-size="40" fill="#172b45" font-weight="750" >三个证据窗口各有退出条件</text>
<text x="64" y="170" font-size="24" fill="#50647c" font-weight="450" >用A/B/C窗口对比基线、故障和复评交付；课程30/60/90天是可编辑规划示例，不是测得工期或晋升时钟。</text>
<g id="evidence-windows" data-region="64,234,1472,690">
<rect x="64" y="234" width="1472" height="690" rx="14" fill="#fff" stroke="#d9e2ed" />
<text x="88" y="279" font-size="27" fill="#172b45" font-weight="700" >用证据窗口安排工作：先验收前窗，再决定下一窗</text>
<text x="88" y="317" font-size="21" fill="#50647c" font-weight="450" >顺序示意 · 30 / 60 / 90 天属于可编辑规划，不是实际工期或晋升承诺</text>
<g id="window-0" class="node" data-region="88,361,452,306">
<rect x="88" y="361" width="452" height="306" rx="14" fill="#edf3ff" stroke="none" />
<text x="112" y="408" font-size="20" fill="#215cbb" font-weight="750" class="mono">01</text>
<text x="112" y="462" font-size="30" fill="#215cbb" font-weight="700" >窗口 A：定基线</text>
<text x="112" y="518" font-size="24" fill="#172b45" font-weight="450" >交 Dataset / Metric Card</text>
<text x="112" y="568" font-size="24" fill="#172b45" font-weight="450" >入口：任务、风险、Oracle 冻结</text>
</g>
<path class="edge edge-evidence" d="M545 514 L556 514" fill="none" stroke="#7045a4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arr-evidence)" />
<g id="window-1" class="node" data-region="570,361,452,306">
<rect x="570" y="361" width="452" height="306" rx="14" fill="#eff4fa" stroke="none" />
<text x="594" y="408" font-size="20" fill="#344f70" font-weight="750" class="mono">02</text>
<text x="594" y="462" font-size="30" fill="#344f70" font-weight="700" >窗口 B：做故障</text>
<text x="594" y="518" font-size="24" fill="#172b45" font-weight="450" >交 RAG retrieval fault 与报告</text>
<text x="594" y="568" font-size="24" fill="#172b45" font-weight="450" >入口：A 工件可复核</text>
</g>
<path class="edge edge-evidence" d="M1027 514 L1038 514" fill="none" stroke="#7045a4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arr-evidence)" />
<g id="window-2" class="node" data-region="1052,361,452,306">
<rect x="1052" y="361" width="452" height="306" rx="14" fill="#f4effb" stroke="none" />
<text x="1076" y="408" font-size="20" fill="#7045a4" font-weight="750" class="mono">03</text>
<text x="1076" y="462" font-size="30" fill="#7045a4" font-weight="700" >窗口 C：交付复评</text>
<text x="1076" y="518" font-size="24" fill="#172b45" font-weight="450" >交独立 Oracle 与 reviewer 意见</text>
<text x="1076" y="568" font-size="24" fill="#172b45" font-weight="450" >入口：故障被检出且保留收据</text>
</g>
<rect x="88" y="708" width="1424" height="158" rx="12" fill="#fff5e5" stroke="none" />
<text x="112" y="751" font-size="26" fill="#945c0b" font-weight="700" >进入下一窗的判据</text>
<text x="112" y="795" font-size="24" fill="#172b45" font-weight="450" >先核对前窗工件、故障收据与 Reviewer；窗口到期不会自动授予能力或责任。故障未打红，回到 Oracle 设计；复</text>
<text x="112" y="831" font-size="24" fill="#172b45" font-weight="450" >评分歧未闭合，升级给 Owner。</text>
</g>
<text x="64" y="978" font-size="21" fill="#215cbb" font-weight="800" class="mono">B</text>
<text x="98" y="978" font-size="27" fill="#172b45" font-weight="700" >把图中的关系落到可执行检查</text>
<g id="detail-0" data-region="64,1008,470,174">
<rect x="64" y="1008" width="470" height="174" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="84" y="1030" width="7" height="30" rx="3" fill="#7045a4" stroke="none" />
<text x="106" y="1055" font-size="25" fill="#7045a4" font-weight="700" >来源与改写</text>
<text x="88" y="1110" font-size="23" fill="#172b45" font-weight="450" >原文多年职级时间线是示例</text>
<text x="88" y="1145" font-size="23" fill="#172b45" font-weight="450" >课程改为证据窗口，不作期限承诺</text>
</g>
<g id="detail-1" data-region="565,1008,470,174">
<rect x="565" y="1008" width="470" height="174" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="585" y="1030" width="7" height="30" rx="3" fill="#945c0b" stroke="none" />
<text x="607" y="1055" font-size="25" fill="#945c0b" font-weight="700" >进入下一窗的条件</text>
<text x="589" y="1110" font-size="23" fill="#172b45" font-weight="450" >按前窗工件与 reviewer 决定</text>
<text x="589" y="1145" font-size="23" fill="#172b45" font-weight="450" >窗口过期不等于能力升级</text>
</g>
<g id="detail-2" data-region="1066,1008,470,174">
<rect x="1066" y="1008" width="470" height="174" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="1086" y="1030" width="7" height="30" rx="3" fill="#7045a4" stroke="none" />
<text x="1108" y="1055" font-size="25" fill="#7045a4" font-weight="700" >要补的真实输入</text>
<text x="1090" y="1110" font-size="23" fill="#172b45" font-weight="450" >投入、起止日期、任务与 owner</text>
<text x="1090" y="1145" font-size="23" fill="#172b45" font-weight="450" >未提供前不绘制数值甘特条</text>
</g>
<g id="failure-and-output" data-region="64,1214,1472,148">
<rect x="64" y="1214" width="1472" height="148" rx="14" fill="#172e4c" stroke="none" />
<text x="88" y="1253" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1298" font-size="23" fill="#ffdce2" font-weight="450" >到期但无证据不能自动进入下一窗；缺样本停补、故障未检出回退、复评分歧升级。</text>
<text x="88" y="1341" font-size="23" fill="#dce9fa" font-weight="450" >交付三个证据窗口的入口、工件、失败动作与复评计划。</text>
</g>
<text x="64" y="1410" font-size="20" fill="#50647c" font-weight="450" >静态设计与 fixture 不证明个人能力、职级、晋升、就业或薪资；真实学习与组织效果 NOT_RUN，组织映射 INTERNAL-UNKNOWN。</text>
<text x="64" y="1449" font-size="18" fill="#50647c" font-weight="450" >对应课程：TD-C03 · 三个证据窗口各有退出条件</text>
