<text x="1108" y="1215" font-size="25" fill="#7045a4" font-weight="700" >动态重排</text>
<text x="1090" y="1270" font-size="23" fill="#172b45" font-weight="450" >任务风险或证据到期重新定位</text>
<text x="1090" y="1305" font-size="23" fill="#172b45" font-weight="450" >同一技能可因任务不同改变动作</text>
