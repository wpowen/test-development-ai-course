<text x="64" y="53" font-size="18" fill="#215cbb" font-weight="750" class="mono">QUALITY ENGINEERING  /  career-priority-quadrant</text>
<text x="64" y="112" font-size="40" fill="#172b45" font-weight="750" >重要性与证据决定下一步</text>
<text x="64" y="170" font-size="24" fill="#50647c" font-weight="450" >任务重要性由 owner 定义，证据成熟度由可复核工件定义；象限安排学习动作，不给人或职级打分。</text>
<g id="priority-quadrant" data-region="64,234,1472,850">
<rect x="64" y="234" width="1472" height="850" rx="14" fill="#fff" stroke="#d9e2ed" />
<text x="88" y="279" font-size="28" fill="#172b45" font-weight="700" >重要性 × 证据成熟度：四类行动规则</text>
<text x="88" y="318" font-size="22" fill="#50647c" font-weight="450" >坐标仅表示低/高的定性类别；象限卡位置是分类示意，不是个人测量点</text>
<g id="quadrant-0-1" class="node" data-region="190,398,630,270">
