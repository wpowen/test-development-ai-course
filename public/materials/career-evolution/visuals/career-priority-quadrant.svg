<text x="88" y="1458" font-size="23" fill="#ffdce2" font-weight="450" >缺 owner 的重要性或无引用的成熟度不可当成个人诊断；保持待定位而非猜测坐标。</text>
<text x="88" y="1501" font-size="23" fill="#dce9fa" font-weight="450" >交付定性四象限的行动规则与复评入口。</text>
