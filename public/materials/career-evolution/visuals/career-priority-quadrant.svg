<text x="878" y="519" font-size="25" fill="#172b45" font-weight="450" >高重要、高证据：随版本复评关键控制</text>
</g>
<g id="quadrant-0-0" class="node" data-region="190,698,630,270">
<rect x="190" y="698" width="630" height="270" rx="14" fill="#eff4fa" stroke="none" />
<text x="218" y="762" font-size="34" fill="#344f70" font-weight="750" >暂缓</text>
<text x="218" y="819" font-size="25" fill="#172b45" font-weight="450" >低重要、低证据：记录触发条件，暂不投入</text>
</g>
<g id="quadrant-1-0" class="node" data-region="850,698,630,270">
