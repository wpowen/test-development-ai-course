<title id="title">重要性与证据决定下一步</title><desc id="desc">任务重要性由 owner 定义，证据成熟度由可复核工件定义；象限安排学习动作，不给人或职级打分。 坐标仅表示低/高的定性类别；象限卡位置是分类示意，不是个人测量点 静态设计与 fixture 不证明个人能力、职级、晋升、就业或薪资；真实学习与组织效果 NOT_RUN，组织映射 INTERNAL-UNKNOWN。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/career-development-original.md#5.1 / 能力发展四象限图;docs/svg-redesign-2026-10-26/body-sources/career-visual-source.original.json#career-priority-quadrant / caption">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;career-priority-quadrant&quot;,&quot;pageIds&quot;:[&quot;TD-C03&quot;],&quot;primaryPageIds&quot;:[],&quot;layout&quot;:&quot;quadrant&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/career-development-original.md&quot;,&quot;locator&quot;:&quot;5.1 / 能力发展四象限图&quot;,&quot;quote&quot;:&quot;高重要 + 低掌握&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/career-visual-source.original.json&quot;,&quot;locator&quot;:&quot;career-priority-quadrant / caption&quot;,&quot;quote&quot;:&quot;重要性由当前任务 owner 定义，成熟度由证据而非自信定义&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;task&quot;,&quot;title&quot;:&quot;任务 owner&quot;},{&quot;id&quot;:&quot;evidence&quot;,&quot;title&quot;:&quot;当前证据核对&quot;},{&quot;id&quot;:&quot;prioritize&quot;,&quot;title&quot;:&quot;优先补齐&quot;},{&quot;id&quot;:&quot;maintain&quot;,&quot;title&quot;:&quot;保持优势&quot;},{&quot;id&quot;:&quot;defer&quot;,&quot;title&quot;:&quot;暂缓&quot;},{&quot;id&quot;:&quot;share&quot;,&quot;title&quot;:&quot;分享与复用&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;task&quot;,&quot;to&quot;:&quot;prioritize&quot;,&quot;label&quot;:&quot;重要性高&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;evidence&quot;,&quot;to&quot;:&quot;prioritize&quot;,&quot;label&quot;:&quot;证据低或缺失&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;task&quot;,&quot;to&quot;:&quot;maintain&quot;,&quot;label&quot;:&quot;重要性高&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;evidence&quot;,&quot;to&quot;:&quot;maintain&quot;,&quot;label&quot;:&quot;已有可核对证据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;task&quot;,&quot;to&quot;:&quot;defer&quot;,&quot;label&quot;:&quot;当前任务重要性低&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;evidence&quot;,&quot;to&quot;:&quot;defer&quot;,&quot;label&quot;:&quot;证据仍缺失&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;task&quot;,&quot;to&quot;:&quot;share&quot;,&quot;label&quot;:&quot;当前任务重要性低&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;evidence&quot;,&quot;to&quot;:&quot;share&quot;,&quot;label&quot;:&quot;已有可复用证据&quot;,&quot;kind&quot;:&quot;evidence&quot;}]}</metadata>
