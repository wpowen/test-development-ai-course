<text x="64" y="53" font-size="18" fill="#215cbb" font-weight="750" class="mono">QUALITY ENGINEERING  /  career-responsibility-ladder</text>
<text x="64" y="112" font-size="40" fill="#172b45" font-weight="750" >责任范围用工件与决定权证明</text>
<text x="64" y="170" font-size="24" fill="#50647c" font-weight="450" >四态描述可承担的责任范围；更广的工作量不自动授予裁决权，组织 band 与年限另需内部适配。</text>
<g id="responsibility-ladder" data-region="64,234,1472,850">
<rect x="64" y="234" width="1472" height="850" rx="14" fill="#fff" stroke="#d9e2ed" />
<text x="88" y="279" font-size="27" fill="#172b45" font-weight="700" >责任范围逐级扩大，决定权必须另有明确授权</text>
<text x="88" y="317" font-size="21" fill="#50647c" font-weight="450" >成长方向示意 · 不按年限、课程数量或 P5–P9 直接授予职级</text>
<g id="responsibility-0" class="node" data-region="88,364,1424,122">
<rect x="88" y="364" width="1424" height="122" rx="14" fill="#edf3ff" stroke="none" />
<text x="110" y="407" font-size="29" fill="#215cbb" font-weight="700" >01  指导下完成</text>
<text x="110" y="451" font-size="22" fill="#172b45" font-weight="450" >guided-execution · 执行记录、缺陷单与解释</text>
</g>
<g id="responsibility-1" class="node" data-region="208,507,1304,122">
<rect x="208" y="507" width="1304" height="122" rx="14" fill="#eff4fa" stroke="none" />
<text x="230" y="550" font-size="29" fill="#344f70" font-weight="700" >02  独立范围负责</text>
<text x="230" y="594" font-size="22" fill="#172b45" font-weight="450" >independent-scoped-ownership · 风险切片 / Oracle / 坏版本打红</text>
</g>
<g id="responsibility-2" class="node" data-region="328,650,1184,122">
<rect x="328" y="650" width="1184" height="122" rx="14" fill="#f4effb" stroke="none" />
<text x="350" y="693" font-size="29" fill="#7045a4" font-weight="700" >03  系统与跨团队杠杆</text>
<text x="350" y="737" font-size="22" fill="#172b45" font-weight="450" >system-cross-team-leverage · 可复用控制与真实消费者</text>
</g>
<g id="responsibility-3" class="node" data-region="448,793,1064,122">
<rect x="448" y="793" width="1064" height="122" rx="14" fill="#e9f7f4" stroke="none" />
<text x="470" y="836" font-size="29" fill="#087b76" font-weight="700" >04  战略治理与培养</text>
<text x="470" y="880" font-size="22" fill="#172b45" font-weight="450" >strategy-governance-mentoring · 标准、评审机制与培养证据</text>
</g>
<text x="88" y="1003" font-size="23" fill="#50647c" font-weight="450" >工件、故障反证、真实消费者与独立 Reviewer 支持责任主张；组织映射须补内部 policy 与具名 Owner，缺失时 INTERNAL-</text>
<text x="88" y="1038" font-size="23" fill="#50647c" font-weight="450" >UNKNOWN。</text>
</g>
<text x="64" y="1138" font-size="21" fill="#215cbb" font-weight="800" class="mono">B</text>
<text x="98" y="1138" font-size="27" fill="#172b45" font-weight="700" >把图中的关系落到可执行检查</text>
<g id="detail-0" data-region="64,1168,470,209">
<rect x="64" y="1168" width="470" height="209" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="84" y="1190" width="7" height="30" rx="3" fill="#7045a4" stroke="none" />
<text x="106" y="1215" font-size="25" fill="#7045a4" font-weight="700" >按能力域分别判断</text>
<text x="88" y="1270" font-size="23" fill="#172b45" font-weight="450" >接口域可独立，Agent域仍需指导</text>
<text x="88" y="1305" font-size="23" fill="#172b45" font-weight="450" >不能用单一总级别覆盖差异</text>
</g>
<g id="detail-1" data-region="565,1168,470,209">
<rect x="565" y="1168" width="470" height="209" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="585" y="1190" width="7" height="30" rx="3" fill="#945c0b" stroke="none" />
<text x="607" y="1215" font-size="25" fill="#945c0b" font-weight="700" >越权不是成长</text>
<text x="589" y="1270" font-size="23" fill="#172b45" font-weight="450" >会改脚本不等于可批资金风险</text>
<text x="589" y="1305" font-size="23" fill="#172b45" font-weight="450" >发布裁决须具名授权</text>
</g>
<g id="detail-2" data-region="1066,1168,470,209">
<rect x="1066" y="1168" width="470" height="209" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="1086" y="1190" width="7" height="30" rx="3" fill="#ad3e4c" stroke="none" />
<text x="1108" y="1215" font-size="25" fill="#ad3e4c" font-weight="700" >组织适配边界</text>
<text x="1090" y="1270" font-size="23" fill="#172b45" font-weight="450" >无内部 policy 保持 INTERNAL-</text>
<text x="1090" y="1305" font-size="23" fill="#172b45" font-weight="450" >UNKNOWN</text>
<text x="1090" y="1340" font-size="23" fill="#172b45" font-weight="450" >年限与课程完成数都不能定级</text>
</g>
<g id="failure-and-output" data-region="64,1409,1472,148">
<rect x="64" y="1409" width="1472" height="148" rx="14" fill="#172e4c" stroke="none" />
<text x="88" y="1448" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1493" font-size="23" fill="#ffdce2" font-weight="450" >只凭年限、证书或工具熟练度升级责任状态时，撤回主张，补工件与他人复核。</text>
<text x="88" y="1536" font-size="23" fill="#dce9fa" font-weight="450" >交付分能力域的责任地图、决定权与复评证据梯。</text>
</g>
<text x="64" y="1605" font-size="20" fill="#50647c" font-weight="450" >静态设计与 fixture 不证明个人能力、职级、晋升、就业或薪资；真实学习与组织效果 NOT_RUN，组织映射 INTERNAL-UNKNOWN。</text>
