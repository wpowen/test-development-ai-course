<title id="title">责任范围用工件与决定权证明</title><desc id="desc">四态描述可承担的责任范围；更广的工作量不自动授予裁决权，组织 band 与年限另需内部适配。 退款 fixture 从跟做、独立设计到跨团队复用和治理带教的证据阶梯 静态设计与 fixture 不证明个人能力、职级、晋升、就业或薪资；真实学习与组织效果 NOT_RUN，组织映射 INTERNAL-UNKNOWN。</desc><metadata data-source-ref="content/modules/career-evolution.ts#TD-C02 / workedExample;content/modules/career-evolution-deep.ts#TD-C02 / mechanism;docs/svg-redesign-2026-10-26/body-sources/material-pages.json#TD-C02 / summary">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;career-responsibility-ladder&quot;,&quot;pageIds&quot;:[&quot;TD-C02&quot;,&quot;TD-C04&quot;],&quot;primaryPageIds&quot;:[&quot;TD-C02&quot;],&quot;layout&quot;:&quot;layers&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;content/modules/career-evolution.ts&quot;,&quot;locator&quot;:&quot;TD-C02 / workedExample&quot;,&quot;quote&quot;:&quot;自己补一条权限切片、写 Oracle、注入坏版本并让它变红&quot;},{&quot;path&quot;:&quot;content/modules/career-evolution-deep.ts&quot;,&quot;locator&quot;:&quot;TD-C02 / mechanism&quot;,&quot;quote&quot;:&quot;同一个人可以在接口测试上处于裁决状态，在 Agent 质量上处于跟做状态。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/material-pages.json&quot;,&quot;locator&quot;:&quot;TD-C02 / summary&quot;,&quot;quote&quot;:&quot;把职业成长从年限和头衔改写为四种可观察的责任状态，并为每个状态绑定决策权、工件、故障和复评者。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;guided&quot;,&quot;title&quot;:&quot;指导下完成&quot;},{&quot;id&quot;:&quot;independent&quot;,&quot;title&quot;:&quot;独立范围负责&quot;},{&quot;id&quot;:&quot;system&quot;,&quot;title&quot;:&quot;系统与跨团队杠杆&quot;},{&quot;id&quot;:&quot;strategy&quot;,&quot;title&quot;:&quot;战略治理与培养&quot;},{&quot;id&quot;:&quot;rights&quot;,&quot;title&quot;:&quot;决定权与失败代价&quot;},{&quot;id&quot;:&quot;review&quot;,&quot;title&quot;:&quot;独立 Reviewer&quot;},{&quot;id&quot;:&quot;organization&quot;,&quot;title&quot;:&quot;组织职级适配&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;guided&quot;,&quot;to&quot;:&quot;independent&quot;,&quot;label&quot;:&quot;新增独立设计与反证工件&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;independent&quot;,&quot;to&quot;:&quot;system&quot;,&quot;label&quot;:&quot;新增跨团队复用证据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;system&quot;,&quot;to&quot;:&quot;strategy&quot;,&quot;label&quot;:&quot;新增规则与培养证据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;rights&quot;,&quot;to&quot;:&quot;review&quot;,&quot;label&quot;:&quot;按授权范围核验&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;guided&quot;,&quot;to&quot;:&quot;review&quot;,&quot;label&quot;:&quot;跟做工件&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;independent&quot;,&quot;to&quot;:&quot;review&quot;,&quot;label&quot;:&quot;独立负责工件&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;system&quot;,&quot;to&quot;:&quot;review&quot;,&quot;label&quot;:&quot;复用工件&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;strategy&quot;,&quot;to&quot;:&quot;review&quot;,&quot;label&quot;:&quot;治理工件&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;review&quot;,&quot;to&quot;:&quot;organization&quot;,&quot;label&quot;:&quot;仅提供责任证据&quot;,&quot;kind&quot;:&quot;evidence&quot;}]}</metadata>
