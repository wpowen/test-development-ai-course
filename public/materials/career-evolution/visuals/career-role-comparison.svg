<title id="title">三类角色怎样分担质量责任</title><desc id="desc">按风险和证据区分传统测试、AI测试开发与AI开发；共享工程底座，最终风险接受由具名责任人承担。 对照三类工作对象，避免把质量评估、能力实现与发布决定混成一项工作 静态设计与 fixture 不证明个人能力、职级、晋升、就业或薪资；真实学习与组织效果 NOT_RUN，组织映射 INTERNAL-UNKNOWN。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/career-development-original.md#1.0 / 核心职责;content/modules/career-evolution.ts#TD-C02 / control;docs/svg-redesign-2026-10-26/body-sources/material-pages.json#TD-F01 / summary">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;career-role-comparison&quot;,&quot;pageIds&quot;:[&quot;TD-F01&quot;,&quot;TD-C02&quot;,&quot;TD-F05&quot;],&quot;primaryPageIds&quot;:[&quot;TD-F01&quot;],&quot;layout&quot;:&quot;comparison&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/career-development-original.md&quot;,&quot;locator&quot;:&quot;1.0 / 核心职责&quot;,&quot;quote&quot;:&quot;保障AI系统的质量，而非开发AI系统&quot;},{&quot;path&quot;:&quot;content/modules/career-evolution.ts&quot;,&quot;locator&quot;:&quot;TD-C02 / control&quot;,&quot;quote&quot;:&quot;哪些决定可以做，哪些决定必须升级给具名 owner？&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/material-pages.json&quot;,&quot;locator&quot;:&quot;TD-F01 / summary&quot;,&quot;quote&quot;:&quot;从真实研发流程出发，先说清测试开发负责什么，再练习阅读需求和技术文档、选择测试方法、建立独立判断依据、整理发布证据，并完成一次可运行的入场自测。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;traditional&quot;,&quot;title&quot;:&quot;传统软件测试&quot;},{&quot;id&quot;:&quot;aitest&quot;,&quot;title&quot;:&quot;AI 测试开发&quot;},{&quot;id&quot;:&quot;aidev&quot;,&quot;title&quot;:&quot;AI 开发&quot;},{&quot;id&quot;:&quot;base&quot;,&quot;title&quot;:&quot;共同工程底座&quot;},{&quot;id&quot;:&quot;evidence&quot;,&quot;title&quot;:&quot;独立质量证据&quot;},{&quot;id&quot;:&quot;release&quot;,&quot;title&quot;:&quot;发布责任人&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;base&quot;,&quot;to&quot;:&quot;traditional&quot;,&quot;label&quot;:&quot;支撑方法与工具&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;base&quot;,&quot;to&quot;:&quot;aitest&quot;,&quot;label&quot;:&quot;支撑数据与评测&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;base&quot;,&quot;to&quot;:&quot;aidev&quot;,&quot;label&quot;:&quot;支撑工程实现&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;aidev&quot;,&quot;to&quot;:&quot;aitest&quot;,&quot;label&quot;:&quot;提供被测能力与版本&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;traditional&quot;,&quot;to&quot;:&quot;evidence&quot;,&quot;label&quot;:&quot;软件控制证据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;aitest&quot;,&quot;to&quot;:&quot;evidence&quot;,&quot;label&quot;:&quot;AI 风险证据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;evidence&quot;,&quot;to&quot;:&quot;release&quot;,&quot;label&quot;:&quot;支撑具名决定&quot;,&quot;kind&quot;:&quot;control&quot;}]}</metadata>
