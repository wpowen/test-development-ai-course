<rect width="1600" height="3046" fill="#f4f7fb"/><rect width="10" height="174" fill="#215cbb"/>
<text x="64" y="53" font-size="18" fill="#215cbb" font-weight="750" class="mono">QUALITY ENGINEERING  /  AG-DIM-36</text>
<text x="64" y="112" font-size="40" fill="#172b45" font-weight="750" >八域三十六维覆盖全景</text>
<text x="64" y="170" font-size="24" fill="#50647c" font-weight="450" >36维是风险覆盖索引，每一维仍要绑定独立 Oracle、case、fault、evidence 与 owner；不是36项通过证明。</text>
<g id="dimensions" data-region="64,234,1472,1352">
<rect x="64" y="234" width="1472" height="1352" rx="14" fill="#fff" stroke="#d9e2ed" />
<text x="88" y="278" font-size="26" fill="#172b45" font-weight="700" >先用 D0 校准评分，按域登记风险，再由四环执行、护栏阻断和具名决定闭合</text>
<text x="88" y="314" font-size="20" fill="#50647c" font-weight="450" >D0 校准全部域的评分；确定性越权和硬红线直接阻断，不等待 Judge。</text>
<g id="domain-0" class="node" data-region="88,340,704,292">
<rect x="88" y="340" width="704" height="292" rx="14" fill="#edf3ff" stroke="none" />
<text x="110" y="382" font-size="27" fill="#215cbb" font-weight="700" >D0 评估可信 · 4维</text>
<text x="110" y="426" font-size="22" fill="#172b45" font-weight="450" >D0-1 Judge 校准与元评估</text>
<text x="110" y="462" font-size="22" fill="#172b45" font-weight="450" >D0-2 评估集卫生</text>
<text x="110" y="498" font-size="22" fill="#172b45" font-weight="450" >D0-3 指标构念效度</text>
<text x="110" y="534" font-size="22" fill="#172b45" font-weight="450" >D0-4 人审闭环与标注一致性</text>
</g>
<g id="domain-1" class="node" data-region="816,340,704,292">
<rect x="816" y="340" width="704" height="292" rx="14" fill="#eff4fa" stroke="none" />
<text x="838" y="382" font-size="27" fill="#344f70" font-weight="700" >D1 单体能力 · 5维</text>
<text x="838" y="426" font-size="22" fill="#172b45" font-weight="450" >D1-1 意图理解</text>
<text x="838" y="462" font-size="22" fill="#172b45" font-weight="450" >D1-2 工具选择与参数</text>
<text x="838" y="498" font-size="22" fill="#172b45" font-weight="450" >D1-3 轨迹质量（span 级）</text>
<text x="838" y="534" font-size="22" fill="#172b45" font-weight="450" >D1-4 记忆读写与检索</text>
<text x="838" y="570" font-size="22" fill="#172b45" font-weight="450" >D1-5 规划与自我修正</text>
</g>
<g id="domain-2" class="node" data-region="88,656,704,256">
<rect x="88" y="656" width="704" height="256" rx="14" fill="#f4effb" stroke="none" />
<text x="110" y="698" font-size="27" fill="#7045a4" font-weight="700" >D2 编排协作 · 4维</text>
<text x="110" y="742" font-size="22" fill="#172b45" font-weight="450" >D2-1 交接与职责边界</text>
<text x="110" y="778" font-size="22" fill="#172b45" font-weight="450" >D2-2 子 Agent 上下文隔离</text>
<text x="110" y="814" font-size="22" fill="#172b45" font-weight="450" >D2-3 级联失败与熔断</text>
<text x="110" y="850" font-size="22" fill="#172b45" font-weight="450" >D2-4 上下文工程</text>
</g>
<g id="domain-3" class="node" data-region="816,656,704,256">
<rect x="816" y="656" width="704" height="256" rx="14" fill="#e9f7f4" stroke="none" />
<text x="838" y="698" font-size="27" fill="#087b76" font-weight="700" >D3 交互协同 · 4维</text>
<text x="838" y="742" font-size="22" fill="#172b45" font-weight="450" >D3-1 多轮交互与上下文保持</text>
<text x="838" y="778" font-size="22" fill="#172b45" font-weight="450" >D3-2 多模态理解</text>
<text x="838" y="814" font-size="22" fill="#172b45" font-weight="450" >D3-3 人机协同</text>
<text x="838" y="850" font-size="22" fill="#172b45" font-weight="450" >D3-4 可解释性与体验</text>
</g>
<g id="domain-4" class="node" data-region="88,936,704,328">
<rect x="88" y="936" width="704" height="328" rx="14" fill="#fff5e5" stroke="none" />
<text x="110" y="978" font-size="27" fill="#945c0b" font-weight="700" >D4 鲁棒可靠 · 5维</text>
<text x="110" y="1022" font-size="22" fill="#172b45" font-weight="450" >D4-1 可靠性分布</text>
<text x="110" y="1058" font-size="22" fill="#172b45" font-weight="450" >D4-2 长时程降级</text>
<text x="110" y="1094" font-size="22" fill="#172b45" font-weight="450" >D4-3 Prompt/输入稳定性</text>
<text x="110" y="1130" font-size="22" fill="#172b45" font-weight="450" >D4-4 异常与自恢复</text>
<text x="110" y="1166" font-size="22" fill="#172b45" font-weight="450" >D4-5 统计回归</text>
</g>
<g id="domain-5" class="node" data-region="816,936,704,328">
<rect x="816" y="936" width="704" height="328" rx="14" fill="#f4effb" stroke="none" />
<text x="838" y="978" font-size="27" fill="#7045a4" font-weight="700" >D5 安全对抗 · 6维</text>
<text x="838" y="1022" font-size="22" fill="#172b45" font-weight="450" >D5-1 直接与间接提示注入</text>
<text x="838" y="1058" font-size="22" fill="#172b45" font-weight="450" >D5-2 工具投毒与 MCP 供应链</text>
<text x="838" y="1094" font-size="22" fill="#172b45" font-weight="450" >D5-3 身份与委托链越权</text>
<text x="838" y="1130" font-size="22" fill="#172b45" font-weight="450" >D5-4 记忆投毒与持久污染</text>
<text x="838" y="1166" font-size="22" fill="#172b45" font-weight="450" >D5-5 代码执行与沙箱逃逸</text>
<text x="838" y="1202" font-size="22" fill="#172b45" font-weight="450" >D5-6 不可逆动作与爆炸半径</text>
</g>
<g id="domain-6" class="node" data-region="88,1288,704,256">
<rect x="88" y="1288" width="704" height="256" rx="14" fill="#fff0f0" stroke="none" />
<text x="110" y="1330" font-size="27" fill="#ad3e4c" font-weight="700" >D6 效率经济 · 4维</text>
<text x="110" y="1374" font-size="22" fill="#172b45" font-weight="450" >D6-1 延迟与吞吐</text>
<text x="110" y="1410" font-size="22" fill="#172b45" font-weight="450" >D6-2 Token 与成本经济学</text>
<text x="110" y="1446" font-size="22" fill="#172b45" font-weight="450" >D6-3 并发与资源隔离</text>
<text x="110" y="1482" font-size="22" fill="#172b45" font-weight="450" >D6-4 可观测性与可复现</text>
</g>
<g id="domain-7" class="node" data-region="816,1288,704,256">
<rect x="816" y="1288" width="704" height="256" rx="14" fill="#edf3ff" stroke="none" />
<text x="838" y="1330" font-size="27" fill="#215cbb" font-weight="700" >D7 业务治理 · 4维</text>
<text x="838" y="1374" font-size="22" fill="#172b45" font-weight="450" >D7-1 业务规则与决策正确性</text>
<text x="838" y="1410" font-size="22" fill="#172b45" font-weight="450" >D7-2 合规与审计证据链</text>
<text x="838" y="1446" font-size="22" fill="#172b45" font-weight="450" >D7-3 变更治理</text>
<text x="838" y="1482" font-size="22" fill="#172b45" font-weight="450" >D7-4 业务价值与 ROI</text>
</g>
</g>
<g id="domain-dependencies" data-region="64,1614,1472,793">
<rect x="64" y="1614" width="1472" height="793" rx="14" fill="#fff" stroke="#d9e2ed" />
<text x="88" y="1658" font-size="27" fill="#172b45" font-weight="700" >域间依赖：清单之后，还要闭合执行、控制与决定</text>
<rect x="88" y="1696" width="1424" height="83" rx="10" fill="#fff5e5" stroke="none" />
<text x="112" y="1731" font-size="25" fill="#945c0b" font-weight="700" >D0 校准所有域的评分；校准失效使评分不可用</text>
<text x="112" y="1764" font-size="22" fill="#50647c" font-weight="450" >确定性越权与硬规则违反直接阻断，不等待 Judge 或统计结论。</text>
<g id="dependency-band-0" data-region="88,1809,1424,126">
<rect x="88" y="1809" width="1424" height="126" rx="14" fill="#edf3ff" stroke="none" />
<text x="112" y="1841" font-size="24" fill="#215cbb" font-weight="700" >四环执行 → 行为轨迹 → D4</text>
<text x="112" y="1874" font-size="22" fill="#172b45" font-weight="450" >四环按各自输入与覆盖范围横向驱动 D1、D4、D5、D6；D1 轨迹支撑 D2 交接与 D3 接管，D4 按任务重复与时长桶形成可靠</text>
<text x="112" y="1907" font-size="22" fill="#172b45" font-weight="450" >性证据，未执行保持 NOT_RUN。</text>
</g>
<g id="dependency-band-1" data-region="88,1951,1424,126">
<rect x="88" y="1951" width="1424" height="126" rx="14" fill="#fff0f0" stroke="none" />
<text x="112" y="1983" font-size="24" fill="#ad3e4c" font-weight="700" >D5 护栏 → 运行阻断</text>
<text x="112" y="2016" font-size="22" fill="#172b45" font-weight="450" >D5 将攻击风险接到最小权限、写前授权和 Kill Switch；D3 提供有效人工确认，D7 提供硬业务规则。已证越权或硬规则违规直</text>
<text x="112" y="2049" font-size="22" fill="#172b45" font-weight="450" >接阻断，不等待 Judge，也不由总分或签名豁免。</text>
</g>
<g id="dependency-band-2" data-region="88,2093,1424,126">
<rect x="88" y="2093" width="1424" height="126" rx="14" fill="#edf3ff" stroke="none" />
<text x="112" y="2125" font-size="24" fill="#215cbb" font-weight="700" >D6 / D7 证据 → 具名决定</text>
<text x="112" y="2158" font-size="22" fill="#172b45" font-weight="450" >D4 分布、D6 成本与暴露量、D7 规则与版本审计交给具名 owner；风险接受写清护栏、范围与到期条件，不代替独立硬阻</text>
<text x="112" y="2191" font-size="22" fill="#172b45" font-weight="450" >断，不自动批准发布。</text>
</g>
<g id="dependency-band-3" data-region="88,2235,1424,126">
<rect x="88" y="2235" width="1424" height="126" rx="14" fill="#edf3ff" stroke="none" />
<text x="112" y="2267" font-size="24" fill="#215cbb" font-weight="700" >失败回灌 → D0 重校准与下一轮</text>
<text x="112" y="2300" font-size="22" fill="#172b45" font-weight="450" >保留失败收据并转成回归案例，送回四环复测；Judge 偏差或换版回到 D0 重校准。D0 失效时所有域评分不可用，新一轮证</text>
<text x="112" y="2333" font-size="22" fill="#172b45" font-weight="450" >据补齐前不继承通过结论。</text>
</g>
</g>
