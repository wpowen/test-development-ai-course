<title id="title">八域三十六维覆盖全景</title><desc id="desc">36维是风险覆盖索引，每一维仍要绑定独立 Oracle、case、fault、evidence 与 owner；不是36项通过证明。 先用 D0 校准评分，按域登记风险，再由四环执行、护栏阻断和具名决定闭合 静态设计与离线 fixture 仅证明控制形状；真实模型、集成、从业者复核及生产有效性均 NOT_RUN。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/agent-architecture-original.txt#四 / 36维明细;docs/svg-redesign-2026-10-26/body-sources/agent-visual-source.original.json#agent-36-dimensions / caption;content/modules/agent-architecture-deep.ts#TD-AG-00 / dimensions.caption;content/modules/agent-architecture-deep.ts#TD-AG-00 / counter;content/modules/agent-architecture-deep.ts#TD-AG-09 / failureModes">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;AG-DIM-36&quot;,&quot;pageIds&quot;:[&quot;TD-AG-00&quot;],&quot;primaryPageIds&quot;:[],&quot;layout&quot;:&quot;dimensions&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/agent-architecture-original.txt&quot;,&quot;locator&quot;:&quot;四 / 36维明细&quot;,&quot;quote&quot;:&quot;这一层不测 Agent,测**你的测量系统**。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/agent-visual-source.original.json&quot;,&quot;locator&quot;:&quot;agent-36-dimensions / caption&quot;,&quot;quote&quot;:&quot;36 维是覆盖清单，不替代场景风险分析；&quot;},{&quot;path&quot;:&quot;content/modules/agent-architecture-deep.ts&quot;,&quot;locator&quot;:&quot;TD-AG-00 / dimensions.caption&quot;,&quot;quote&quot;:&quot;D0 校准所有分数&quot;},{&quot;path&quot;:&quot;content/modules/agent-architecture-deep.ts&quot;,&quot;locator&quot;:&quot;TD-AG-00 / counter&quot;,&quot;quote&quot;:&quot;四个环是横向驱动 D1/D4/D5/D6 的，不是串在末尾。&quot;},{&quot;path&quot;:&quot;content/modules/agent-architecture-deep.ts&quot;,&quot;locator&quot;:&quot;TD-AG-09 / failureModes&quot;,&quot;quote&quot;:&quot;发生一次即不可接受的事件不能做成区间判定&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;d0&quot;,&quot;title&quot;:&quot;D0 校准&quot;},{&quot;id&quot;:&quot;d1&quot;,&quot;title&quot;:&quot;D1 单体&quot;},{&quot;id&quot;:&quot;d2&quot;,&quot;title&quot;:&quot;D2 编排&quot;},{&quot;id&quot;:&quot;d3&quot;,&quot;title&quot;:&quot;D3 人机&quot;},{&quot;id&quot;:&quot;d4&quot;,&quot;title&quot;:&quot;D4 可靠&quot;},{&quot;id&quot;:&quot;d5&quot;,&quot;title&quot;:&quot;D5 安全&quot;},{&quot;id&quot;:&quot;d6&quot;,&quot;title&quot;:&quot;D6 经济&quot;},{&quot;id&quot;:&quot;d7&quot;,&quot;title&quot;:&quot;D7 治理&quot;},{&quot;id&quot;:&quot;rings&quot;,&quot;title&quot;:&quot;四证据环&quot;},{&quot;id&quot;:&quot;guard&quot;,&quot;title&quot;:&quot;运行时护栏&quot;},{&quot;id&quot;:&quot;decision&quot;,&quot;title&quot;:&quot;具名决定&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;d0&quot;,&quot;to&quot;:&quot;d1&quot;,&quot;label&quot;:&quot;校准评分&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;d0&quot;,&quot;to&quot;:&quot;d4&quot;,&quot;label&quot;:&quot;校准分布判据&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;d0&quot;,&quot;to&quot;:&quot;d7&quot;,&quot;label&quot;:&quot;校准治理评分&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;d0&quot;,&quot;to&quot;:&quot;d2&quot;,&quot;label&quot;:&quot;校准协作评分&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;d0&quot;,&quot;to&quot;:&quot;d3&quot;,&quot;label&quot;:&quot;校准交互评分&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;d0&quot;,&quot;to&quot;:&quot;d5&quot;,&quot;label&quot;:&quot;校准安全评分&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;d0&quot;,&quot;to&quot;:&quot;d6&quot;,&quot;label&quot;:&quot;校准资源评分&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;d0&quot;,&quot;to&quot;:&quot;decision&quot;,&quot;label&quot;:&quot;失准则所有评分不可用&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;d1&quot;,&quot;to&quot;:&quot;d2&quot;,&quot;label&quot;:&quot;轨迹支撑交接归因&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;d2&quot;,&quot;to&quot;:&quot;d3&quot;,&quot;label&quot;:&quot;交接决定接管点&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;rings&quot;,&quot;to&quot;:&quot;d1&quot;,&quot;label&quot;:&quot;按环记录轨迹&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;rings&quot;,&quot;to&quot;:&quot;d4&quot;,&quot;label&quot;:&quot;按环重复执行&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;rings&quot;,&quot;to&quot;:&quot;d5&quot;,&quot;label&quot;:&quot;持续对抗&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;rings&quot;,&quot;to&quot;:&quot;d6&quot;,&quot;label&quot;:&quot;按环测资源&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;d5&quot;,&quot;to&quot;:&quot;guard&quot;,&quot;label&quot;:&quot;输出强制控制&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;d3&quot;,&quot;to&quot;:&quot;guard&quot;,&quot;label&quot;:&quot;有效人工确认&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;d7&quot;,&quot;to&quot;:&quot;guard&quot;,&quot;label&quot;:&quot;业务硬规则强制控制&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;d4&quot;,&quot;to&quot;:&quot;decision&quot;,&quot;label&quot;:&quot;可靠性证据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;d6&quot;,&quot;to&quot;:&quot;decision&quot;,&quot;label&quot;:&quot;经济性证据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;d7&quot;,&quot;to&quot;:&quot;decision&quot;,&quot;label&quot;:&quot;规则与责任&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;guard&quot;,&quot;to&quot;:&quot;decision&quot;,&quot;label&quot;:&quot;停止回执&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;d5&quot;,&quot;to&quot;:&quot;decision&quot;,&quot;label&quot;:&quot;已证越权直接 BLOCKED&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;d7&quot;,&quot;to&quot;:&quot;decision&quot;,&quot;label&quot;:&quot;已证硬规则违规直接阻断&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;decision&quot;,&quot;to&quot;:&quot;rings&quot;,&quot;label&quot;:&quot;失败回灌与复测&quot;,&quot;kind&quot;:&quot;feedback&quot;},{&quot;from&quot;:&quot;decision&quot;,&quot;to&quot;:&quot;d0&quot;,&quot;label&quot;:&quot;Judge 重校准&quot;,&quot;kind&quot;:&quot;feedback&quot;}]}</metadata>
