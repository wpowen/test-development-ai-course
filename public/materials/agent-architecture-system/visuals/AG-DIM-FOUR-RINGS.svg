<rect width="1600" height="1989" fill="#f4f7fb"/><rect width="10" height="174" fill="#215cbb"/>
<text x="64" y="53" font-size="18" fill="#215cbb" font-weight="750" class="mono">QUALITY ENGINEERING  /  AG-DIM-FOUR-RINGS</text>
<text x="64" y="112" font-size="40" fill="#172b45" font-weight="750" >四环各有独立的证据出口</text>
<text x="64" y="170" font-size="24" fill="#50647c" font-weight="450" >四环按输入与副作用边界区分证据强度；exit 合格只允许申请下一个环，不能替代该环真实运行。</text>
<g id="four-rings" data-region="64,234,1472,1151">
<rect x="64" y="234" width="1472" height="1151" rx="14" fill="#fff" stroke="#d9e2ed" />
<text x="88" y="280" font-size="28" fill="#172b45" font-weight="700" >四环证据比较：每列独立验收，成熟度不能合并</text>
<text x="88" y="322" font-size="23" fill="#50647c" font-weight="450" >共同输入：population / 版本 / 统计方法 / entry / exit / 具名 owner / hard block / rollback</text>
<g id="ring-0" class="node" data-region="88,384,338,609">
<rect x="88" y="384" width="338" height="609" rx="14" fill="#edf3ff" stroke="none" />
<text x="108" y="431" font-size="28" fill="#215cbb" font-weight="700" >01 离线 fixture</text>
<text x="108" y="499" font-size="23" fill="#172b45" font-weight="450" >输入：固定案例与独立</text>
<text x="108" y="534" font-size="23" fill="#172b45" font-weight="450" >Oracle</text>
<text x="108" y="586" font-size="23" fill="#172b45" font-weight="450" >执行：离线 CI 注入与回放</text>
<text x="108" y="638" font-size="23" fill="#172b45" font-weight="450" >出口：坏版本被确定性拦下</text>
<text x="108" y="690" font-size="23" fill="#172b45" font-weight="450" >责任：本环 owner 待具名</text>
<text x="108" y="742" font-size="23" fill="#172b45" font-weight="450" >硬阻断：漏检已知故障</text>
<text x="108" y="794" font-size="23" fill="#172b45" font-weight="450" >回滚：保留失败，修夹具</text>
</g>
<path class="edge edge-evidence" d="M257 999 L257 1040" fill="none" stroke="#7045a4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arr-evidence)" />
<g id="ring-1" class="node" data-region="450,384,338,609">
<rect x="450" y="384" width="338" height="609" rx="14" fill="#e9f7f4" stroke="none" />
<text x="470" y="431" font-size="28" fill="#087b76" font-weight="700" >02 受控沙箱</text>
<text x="470" y="499" font-size="23" fill="#172b45" font-weight="450" >输入：隔离工具与状态</text>
<text x="470" y="551" font-size="23" fill="#172b45" font-weight="450" >执行：受控回放与重复运行</text>
<text x="470" y="603" font-size="23" fill="#172b45" font-weight="450" >出口：副作用、恢复与重</text>
<text x="470" y="638" font-size="23" fill="#172b45" font-weight="450" >复证据</text>
<text x="470" y="690" font-size="23" fill="#172b45" font-weight="450" >责任：本环 owner 待具名</text>
<text x="470" y="742" font-size="23" fill="#172b45" font-weight="450" >硬阻断：隔离或副作用失守</text>
<text x="470" y="794" font-size="23" fill="#172b45" font-weight="450" >回滚：停运行，恢复沙箱</text>
<text x="470" y="829" font-size="23" fill="#172b45" font-weight="450" >状态</text>
</g>
<path class="edge edge-evidence" d="M619 999 L619 1040" fill="none" stroke="#7045a4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arr-evidence)" />
<g id="ring-2" class="node" data-region="812,384,338,609">
<rect x="812" y="384" width="338" height="609" rx="14" fill="#f4effb" stroke="none" />
<text x="832" y="431" font-size="28" fill="#7045a4" font-weight="700" >03 影子 / 灰度</text>
<text x="832" y="499" font-size="23" fill="#172b45" font-weight="450" >输入：获准的真实分布</text>
<text x="832" y="551" font-size="23" fill="#172b45" font-weight="450" >影子：结果不生效、不执</text>
<text x="832" y="586" font-size="23" fill="#172b45" font-weight="450" >行动作</text>
<text x="832" y="638" font-size="23" fill="#172b45" font-weight="450" >灰度：另审生效范围与回滚</text>
<text x="832" y="690" font-size="23" fill="#172b45" font-weight="450" >出口：分布对比 Trace、评</text>
<text x="832" y="725" font-size="23" fill="#172b45" font-weight="450" >分与隔离证据</text>
<text x="832" y="777" font-size="23" fill="#172b45" font-weight="450" >责任：业务与发布 owner</text>
<text x="832" y="812" font-size="23" fill="#172b45" font-weight="450" >待具名</text>
<text x="832" y="864" font-size="23" fill="#172b45" font-weight="450" >硬阻断：未经批准生效</text>
<text x="832" y="916" font-size="23" fill="#172b45" font-weight="450" >回滚：撤回灰度并保留证据</text>
</g>
<path class="edge edge-evidence" d="M981 999 L981 1040" fill="none" stroke="#7045a4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arr-evidence)" />
<g id="ring-3" class="node" data-region="1174,384,338,609">
<rect x="1174" y="384" width="338" height="609" rx="14" fill="#fff5e5" stroke="none" />
<text x="1194" y="431" font-size="28" fill="#945c0b" font-weight="700" >04 在线持续</text>
<text x="1194" y="499" font-size="23" fill="#172b45" font-weight="450" >输入：批准范围内线上任务</text>
<text x="1194" y="551" font-size="23" fill="#172b45" font-weight="450" >执行：风险采样与高危捕获</text>
<text x="1194" y="603" font-size="23" fill="#172b45" font-weight="450" >出口：告警处置与漂移证据</text>
<text x="1194" y="655" font-size="23" fill="#172b45" font-weight="450" >责任：值班与风险 owner</text>
<text x="1194" y="690" font-size="23" fill="#172b45" font-weight="450" >待具名</text>
<text x="1194" y="742" font-size="23" fill="#172b45" font-weight="450" >硬阻断：安全与业务红线</text>
<text x="1194" y="794" font-size="23" fill="#172b45" font-weight="450" >回滚：隔离、停止并留存</text>
<text x="1194" y="829" font-size="23" fill="#172b45" font-weight="450" >收据</text>
</g>
<path class="edge edge-evidence" d="M1343 999 L1343 1040" fill="none" stroke="#7045a4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arr-evidence)" />
<g id="ring-exit" data-region="88,1059,1424,126">
<rect x="88" y="1059" width="1424" height="126" rx="14" fill="#edf3ff" stroke="none" />
<text x="112" y="1100" font-size="27" fill="#215cbb" font-weight="700" >逐环参数化门禁</text>
<text x="112" y="1141" font-size="24" fill="#172b45" font-weight="450" >硬政策 + 统计证据 + 具名风险接受；exit 合格只允许申请下一环，不能代替下一环真实运行。</text>
</g>
<path class="edge edge-risk" d="M800 1192 L800 1228" fill="none" stroke="#ad3e4c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arr-risk)" />
<g id="ring-rollback" data-region="88,1245,1424,108">
<rect x="88" y="1245" width="1424" height="108" rx="14" fill="#fff0f0" stroke="none" />
<text x="112" y="1285" font-size="25" fill="#ad3e4c" font-weight="700" >任一环失败 → 停止升级 / rollback → 保留失败 → 更新离线回归 fixture</text>
<text x="112" y="1328" font-size="23" fill="#50647c" font-weight="450" >当前课程的本地模拟收据不代表真实沙箱、影子或线上验证；未运行环保持 NOT_RUN。</text>
</g>
</g>
<text x="64" y="1439" font-size="21" fill="#215cbb" font-weight="800" class="mono">B</text>
<text x="98" y="1439" font-size="27" fill="#172b45" font-weight="700" >把图中的关系落到可执行检查</text>
<g id="detail-0" data-region="64,1469,470,174">
<rect x="64" y="1469" width="470" height="174" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="84" y="1491" width="7" height="30" rx="3" fill="#7045a4" stroke="none" />
<text x="106" y="1516" font-size="25" fill="#7045a4" font-weight="700" >entry：进入前</text>
<text x="88" y="1571" font-size="23" fill="#172b45" font-weight="450" >每环声明真实输入与权限</text>
<text x="88" y="1606" font-size="23" fill="#172b45" font-weight="450" >owner / 统计方法 / hard block</text>
</g>
<g id="detail-1" data-region="565,1469,470,174">
<rect x="565" y="1469" width="470" height="174" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="585" y="1491" width="7" height="30" rx="3" fill="#945c0b" stroke="none" />
<text x="607" y="1516" font-size="25" fill="#945c0b" font-weight="700" >exit：离开前</text>
<text x="589" y="1571" font-size="23" fill="#172b45" font-weight="450" >新证据支持有限范围升级</text>
<text x="589" y="1606" font-size="23" fill="#172b45" font-weight="450" >缺采样、回滚或隔离不得升级</text>
</g>
<g id="detail-2" data-region="1066,1469,470,174">
<rect x="1066" y="1469" width="470" height="174" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="1086" y="1491" width="7" height="30" rx="3" fill="#7045a4" stroke="none" />
<text x="1108" y="1516" font-size="25" fill="#7045a4" font-weight="700" >当前证据状态</text>
<text x="1090" y="1571" font-size="23" fill="#172b45" font-weight="450" >课程可有环1/2本地模拟收据</text>
<text x="1090" y="1606" font-size="23" fill="#172b45" font-weight="450" >真实沙箱、影子及在线 NOT_RUN</text>
</g>
<g id="failure-and-output" data-region="64,1675,1472,148">
<rect x="64" y="1675" width="1472" height="148" rx="14" fill="#172e4c" stroke="none" />
<text x="88" y="1714" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1759" font-size="23" fill="#ffdce2" font-weight="450" >任一环失败即阻断升级，rollback 保留失败环与 owner；不套用固定分钟、天数或流量比例。</text>
<text x="88" y="1802" font-size="23" fill="#dce9fa" font-weight="450" >交付带 entry、exit、rollback 的四环计划与逐环证据状态。</text>
</g>
<text x="64" y="1871" font-size="20" fill="#50647c" font-weight="450" >静态设计与离线 fixture 仅证明控制形状；真实模型、集成、从业者复核及生产有效性均 NOT_RUN。</text>
<text x="64" y="1910" font-size="18" fill="#50647c" font-weight="450" >对应课程：TD-AG-09 · 四环各有独立的证据出口</text>
