<title id="title">四环各有独立的证据出口</title><desc id="desc">四环按输入与副作用边界区分证据强度；exit 合格只允许申请下一个环，不能替代该环真实运行。 四列比较 entry、exit、owner、hard block 与 rollback，不预设时长和流量比例 静态设计与离线 fixture 仅证明控制形状；真实模型、集成、从业者复核及生产有效性均 NOT_RUN。</desc><metadata data-source-ref="content/modules/agent-architecture-deep.ts#TD-AG-09 / artifactNote;docs/svg-redesign-2026-10-26/body-sources/agent-architecture-original.txt#五 / 环3影子模式;docs/svg-redesign-2026-10-26/body-sources/material-pages.json#TD-AG-09 / summary">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;AG-DIM-FOUR-RINGS&quot;,&quot;pageIds&quot;:[&quot;TD-AG-09&quot;],&quot;primaryPageIds&quot;:[&quot;TD-AG-09&quot;],&quot;layout&quot;:&quot;comparison&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;content/modules/agent-architecture-deep.ts&quot;,&quot;locator&quot;:&quot;TD-AG-09 / artifactNote&quot;,&quot;quote&quot;:&quot;每个环必须声明五件事：population、统计方法、owner、hard block、rollback。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/agent-architecture-original.txt&quot;,&quot;locator&quot;:&quot;五 / 环3影子模式&quot;,&quot;quote&quot;:&quot;不返回给用户、不执行任何动作&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/material-pages.json&quot;,&quot;locator&quot;:&quot;TD-AG-09 / summary&quot;,&quot;quote&quot;:&quot;将离线 CI、沙箱回放、影子灰度和在线持续评估串成证据成熟度链，再执行硬红线、统计门禁和风险接受。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;contract&quot;,&quot;title&quot;:&quot;每环输入合同&quot;},{&quot;id&quot;:&quot;r1&quot;,&quot;title&quot;:&quot;环1 离线 fixture&quot;},{&quot;id&quot;:&quot;r2&quot;,&quot;title&quot;:&quot;环2 受控沙箱&quot;},{&quot;id&quot;:&quot;r3&quot;,&quot;title&quot;:&quot;环3 影子 / 灰度&quot;},{&quot;id&quot;:&quot;r4&quot;,&quot;title&quot;:&quot;环4 在线持续&quot;},{&quot;id&quot;:&quot;gate&quot;,&quot;title&quot;:&quot;参数化门禁&quot;},{&quot;id&quot;:&quot;rollback&quot;,&quot;title&quot;:&quot;rollback 与隔离&quot;},{&quot;id&quot;:&quot;feedback&quot;,&quot;title&quot;:&quot;失败回灌 fixture&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;contract&quot;,&quot;to&quot;:&quot;r1&quot;,&quot;label&quot;:&quot;环1 entry&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;contract&quot;,&quot;to&quot;:&quot;r2&quot;,&quot;label&quot;:&quot;环2 entry&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;contract&quot;,&quot;to&quot;:&quot;r3&quot;,&quot;label&quot;:&quot;环3 entry&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;contract&quot;,&quot;to&quot;:&quot;r4&quot;,&quot;label&quot;:&quot;环4 entry&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;r1&quot;,&quot;to&quot;:&quot;gate&quot;,&quot;label&quot;:&quot;离线 exit 证据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;r2&quot;,&quot;to&quot;:&quot;gate&quot;,&quot;label&quot;:&quot;沙箱 exit 证据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;r3&quot;,&quot;to&quot;:&quot;gate&quot;,&quot;label&quot;:&quot;真实分布证据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;r4&quot;,&quot;to&quot;:&quot;gate&quot;,&quot;label&quot;:&quot;在线持续证据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;gate&quot;,&quot;to&quot;:&quot;rollback&quot;,&quot;label&quot;:&quot;exit 不满足或 blocker&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;rollback&quot;,&quot;to&quot;:&quot;feedback&quot;,&quot;label&quot;:&quot;归因与保留失败&quot;,&quot;kind&quot;:&quot;feedback&quot;},{&quot;from&quot;:&quot;feedback&quot;,&quot;to&quot;:&quot;r1&quot;,&quot;label&quot;:&quot;生成回归 fixture&quot;,&quot;kind&quot;:&quot;feedback&quot;}]}</metadata>
