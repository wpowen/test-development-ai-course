uot;to&quot;:&quot;gate&quot;,&quot;label&quot;:&quot;带引用候选&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;oracle&quot;,&quot;to&quot;:&quot;gate&quot;,&quot;label&quot;:&quot;独立校验&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;basis&quot;,&quot;to&quot;:&quot;gate&quot;,&quot;label&quot;:&quot;核对原文&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;gate&quot;,&quot;to&quot;:&quot;stop&quot;,&quot;label&quot;:&quot;缺失 / 冲突&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;gate&quot;,&quot;to&quot;:&quot;owner&quot;,&quot;label&quot;:&quot;引用闭合&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;owner&quot;,&quot;to&quot;:&quot;backlog&quot;,&quot;label&quot;:&quot;接受并留痕&quot;,&quot;kind&quot;:&quot;control&quot;}]}</metadata>
