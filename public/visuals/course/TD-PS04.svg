<text x="88" y="1900.938808373591" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1945.938808373591" font-size="23" fill="#ffdce2" font-weight="450" >固定 sleep、动态文案定位、重复退款或缺业务终态 Oracle 时退回修复。</text>
<text x="88" y="1988.938808373591" font-size="23" fill="#dce9fa" font-weight="450" >交付稳定旅程、隔离与等待配置、业务断言和可回放失败包。</text>
