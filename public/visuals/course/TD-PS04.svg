<rect x="585" y="1677.938808373591" width="7" height="30" rx="3" fill="#945c0b" stroke="none" />
<text x="607" y="1702.938808373591" font-size="25" fill="#945c0b" font-weight="700" >交互就绪不等于成功</text>
<text x="589" y="1757.938808373591" font-size="23" fill="#172b45" font-weight="450" >actionability 只保证动作前提</text>
<text x="589" y="1792.938808373591" font-size="23" fill="#172b45" font-weight="450" >最终断言用 API、账本与审计</text>
</g>
