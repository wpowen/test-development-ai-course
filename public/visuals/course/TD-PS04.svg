<title id="title">UI 可交互之后，还要等业务终态</title><desc id="desc">隔离数据与上下文、稳定定位和条件等待控制执行；业务 API 与 Trace 决定结果和归因。 退款审批旅程的可控输入、UI 动作、后端 Oracle 与失败现场 未运行浏览器时保持 NOT_RUN；Stub 稳定不代表真实第三方或生产链路通过。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-1.json#TD-PS04 / 语义定位器与自动等待凭什么把 UI 不稳定压下去;docs/svg-redesign-2026-10-26/body-sources/course-1.json#TD-PS04 / 让退款 UI 等到业务终态而不是文案出现">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-PS04&quot;,&quot;pageIds&quot;:[&quot;TD-PS04&quot;],&quot;primaryPageIds&quot;:[&quot;TD-PS04&quot;],&quot;layout&quot;:&quot;layers&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-1.json&quot;,&quot;locator&quot;:&quot;TD-PS04 / 语义定位器与自动等待凭什么把 UI 不稳定压下去&quot;,&quot;quote&quot;:&quot;它保证的是动作可以发生，不保证动作产生了正确的业务结果&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-1.json&quot;,&quot;locator&quot;:&quot;TD-PS04 / 让退款 UI 等到业务终态而不是文案出现&quot;,&quot;quote&quot;:&quot;UI 终态、订单 API 与审计记录一致&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;factory&quot;,&quot;title&quot;:&quot;测试数据工厂&quot;},{&quot;id&quot;:&quot;context&quot;,&quot;title&quot;:&quot;独立浏览器上下文&quot;},{&quot;id&quot;:&quot;stub&quot;,&quot;title&quot;:&quot;第三方路由 Stub&quot;},{&quot;id&quot;:&quot;ui&quot;,&quot;title&quot;:&quot;退款 Web UI&quot;},{&quot;id&quot;:&quot;api&quot;,&quot;title&quot;:&quot;订单 / 退款 API&quot;},{&quot;id&quot;:&quot;trace&quot;,&quot;title&quot;:&quot;失败现场&quot;},{&quot;id&quot;:&quot;gate&quot;,&quot;title&quot;:&quot;关键旅程回归门禁&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;factory&quot;,&quot;to&quot;:&quot;context&quot;,&quot;label&quot;:&quot;独立运行数据&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;context&quot;,&quot;to&quot;:&quot;ui&quot;,&quot;label&quot;:&quot;隔离会话&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;stub&quot;,&quot;to&quot;:&quot;ui&quot;,&quot;label&quot;:&quot;受控外部响应&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;ui&quot;,&quot;to&quot;:&quot;api&quot;,&quot;label&quot;:&quot;业务操作与状态查询&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;ui&quot;,&quot;to&quot;:&quot;trace&quot;,&quot;label&quot;:&quot;呈现与网络现场&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;api&quot;,&quot;to&quot;:&quot;gate&quot;,&quot;label&quot;:&quot;业务终态 Oracle&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;trace&quot;,&quot;to&quot;:&quot;gate&quot;,&quot;label&quot;:&quot;失败可回放&quot;,&quot;kind&quot;:&quot;evidence&quot;}]}</metadata>
