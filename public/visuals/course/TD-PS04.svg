<text x="106" y="1702.938808373591" font-size="25" fill="#ad3e4c" font-weight="700" >不稳定按机制拆</text>
<text x="88" y="1757.938808373591" font-size="23" fill="#172b45" font-weight="450" >单跑通批量挂先查状态污染</text>
<text x="88" y="1792.938808373591" font-size="23" fill="#172b45" font-weight="450" >找不到元素查 locator 与等待条件</text>
