<text x="1090" y="1771.3556496088238" font-size="23" fill="#172b45" font-weight="450" >同一测试包绑定相同 oracle_id</text>
<text x="1090" y="1806.3556496088238" font-size="23" fill="#172b45" font-weight="450" >固定 cwd、依赖、版本与报告路径</text>
