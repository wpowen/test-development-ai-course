<title id="title">执行器翻译动作，Oracle 约束断言</title><desc id="desc">TestPackage 保持业务语义，适配器映射请求与控件；执行报告必须原样交回首败、重试和跳过。 从已批准测试包到多个 adapter，再到不可吞错的证据收集 教学 adapter 不执行生产退款或扣款；真实生成和企业集成仍需另行验证。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-1.json#TD-P06 / P06 工作示例：把 Test Package 安全接入自动化;docs/svg-redesign-2026-10-26/body-sources/course-1.json#TD-P06 / 追溯索引让变更可以选择回归集">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-P06&quot;,&quot;pageIds&quot;:[&quot;TD-P06&quot;],&quot;primaryPageIds&quot;:[&quot;TD-P06&quot;],&quot;layout&quot;:&quot;layers&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-1.json&quot;,&quot;locator&quot;:&quot;TD-P06 / P06 工作示例：把 Test Package 安全接入自动化&quot;,&quot;quote&quot;:&quot;它不能改变 expected、吞断言异常或无限重试&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-1.json&quot;,&quot;locator&quot;:&quot;TD-P06 / 追溯索引让变更可以选择回归集&quot;,&quot;quote&quot;:&quot;test_id -&gt; file/function -&gt; requirement_ids -&gt; risk_ids -&gt; oracle_ids&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;package&quot;,&quot;title&quot;:&quot;已批准 TestPackage&quot;},{&quot;id&quot;:&quot;api&quot;,&quot;title&quot;:&quot;API sandbox adapter&quot;},{&quot;id&quot;:&quot;browser&quot;,&quot;title&quot;:&quot;Browser adapter&quot;},{&quot;id&quot;:&quot;probe&quot;,&quot;title&quot;:&quot;DB / Event 证据探针&quot;},{&quot;id&quot;:&quot;runner&quot;,&quot;title&quot;:&quot;Runner 比较并传播失败&quot;},{&quot;id&quot;:&quot;fake&quot;,&quot;title&quot;:&quot;假绿故障注入&quot;},{&quot;id&quot;:&quot;report&quot;,&quot;title&quot;:&quot;可归因运行报告&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;package&quot;,&quot;to&quot;:&quot;api&quot;,&quot;label&quot;:&quot;映射动作&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;package&quot;,&quot;to&quot;:&quot;browser&quot;,&quot;label&quot;:&quot;映射旅程&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;package&quot;,&quot;to&quot;:&quot;runner&quot;,&quot;label&quot;:&quot;批准 Oracle&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;api&quot;,&quot;to&quot;:&quot;runner&quot;,&quot;label&quot;:&quot;response/actual&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;browser&quot;,&quot;to&quot;:&quot;runner&quot;,&quot;label&quot;:&quot;UI 与请求证据&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;probe&quot;,&quot;to&quot;:&quot;runner&quot;,&quot;label&quot;:&quot;副作用证据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;fake&quot;,&quot;to&quot;:&quot;runner&quot;,&quot;label&quot;:&quot;负控制应被拦截&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;runner&quot;,&quot;to&quot;:&quot;report&quot;,&quot;label&quot;:&quot;原始失败向上传播&quot;,&quot;kind&quot;:&quot;evidence&quot;}]}</metadata>
