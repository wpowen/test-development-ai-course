<text x="88" y="1914.3556496088238" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1959.3556496088238" font-size="23" fill="#ffdce2" font-weight="450" >吞异常、未经批准 skip 或按实际响应改预期时，FAKE_GREEN_AUTOMATION 阻断。</text>
<text x="88" y="2002.3556496088238" font-size="23" fill="#dce9fa" font-weight="450" >交付 adapter contract、追踪索引和 baseline/fault/repair 原始报告。</text>
