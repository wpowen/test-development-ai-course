<text x="64" y="53" font-size="18" fill="#215cbb" font-weight="750" class="mono">QUALITY ENGINEERING  /  TD-X501</text>
<text x="64" y="112" font-size="40" fill="#172b45" font-weight="750" >图文关系用配对对照，而非单模态加总</text>
<text x="64" y="170" font-size="24" fill="#50647c" font-weight="450" >保持模态各自自洽，只翻转一个跨模态关系，再用受保护 Oracle 判定冲突与处置。</text>
