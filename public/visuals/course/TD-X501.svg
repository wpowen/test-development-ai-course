<title id="title">图文关系用配对对照，而非单模态加总</title><desc id="desc">保持模态各自自洽，只翻转一个跨模态关系，再用受保护 Oracle 判定冲突与处置。 完整输入、关系错配与缺模态三组对照，共享 pair/group 级判据 合成配对 fault 不证明真实设备、音画同步、标注者或生产分布。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-2.json#TD-X501 / 多模态的失败不在单个模态里，在模态之间的关系里;docs/svg-redesign-2026-10-26/body-sources/course-2.json#TD-X501 / TD-X501 Fault（退出 1）：让目标故障被点名">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-X501&quot;,&quot;pageIds&quot;:[&quot;TD-X501&quot;],&quot;primaryPageIds&quot;:[&quot;TD-X501&quot;],&quot;layout&quot;:&quot;comparison&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-2.json&quot;,&quot;locator&quot;:&quot;TD-X501 / 多模态的失败不在单个模态里，在模态之间的关系里&quot;,&quot;quote&quot;:&quot;只翻转一个实体、属性、时序或语义关系&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-2.json&quot;,&quot;locator&quot;:&quot;TD-X501 / TD-X501 Fault（退出 1）：让目标故障被点名&quot;,&quot;quote&quot;:&quot;cross_modal_alignment 与 oracle_independent 必须变红。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;contract&quot;,&quot;title&quot;:&quot;任务 / 模态合同&quot;},{&quot;id&quot;:&quot;natural&quot;,&quot;title&quot;:&quot;一致配对与自然样本&quot;},{&quot;id&quot;:&quot;flip&quot;,&quot;title&quot;:&quot;关系错配变体&quot;},{&quot;id&quot;:&quot;missing&quot;,&quot;title&quot;:&quot;缺模态组合&quot;},{&quot;id&quot;:&quot;relation&quot;,&quot;title&quot;:&quot;跨模态关系被测项&quot;},{&quot;id&quot;:&quot;oracle&quot;,&quot;title&quot;:&quot;独立关系 Oracle&quot;},{&quot;id&quot;:&quot;slices&quot;,&quot;title&quot;:&quot;Pair / group 切片结果&quot;},{&quot;id&quot;:&quot;human&quot;,&quot;title&quot;:&quot;争议与高风险人工复核&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;contract&quot;,&quot;to&quot;:&quot;natural&quot;,&quot;label&quot;:&quot;原始对照&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;contract&quot;,&quot;to&quot;:&quot;flip&quot;,&quot;label&quot;:&quot;批准关系变异&quot;