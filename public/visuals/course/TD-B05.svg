<title id="title">污染与版本审计限制榜单结论</title><desc id="desc">版本兼容、暴露审计、封存泄露信号和配对区间共同决定分数是否可比。 审计未检出重复不等于排除间接泄漏 未检出逐字或近重复不能证明没有污染；训练语料和间接泄漏不可见时保持未知。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-B05 / 三种污染形态的可检出程度差了两个量级;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-B05 / 架构节点与交付物;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-B05 / 隐藏测试集挡得住过拟合，挡不住训练污染">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-B05&quot;,&quot;pageIds&quot;:[&quot;TD-B05&quot;],&quot;primaryPageIds&quot;:[&quot;TD-B05&quot;],&quot;layout&quot;:&quot;evidence&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-B05 / 三种污染形态的可检出程度差了两个量级&quot;,&quot;quote&quot;:&quot;四行里没有一行能给出「已排除污染」的结论。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-B05 / 架构节点与交付物&quot;,&quot;quote&quot;:&quot;把每个分数标注为可比 / 有限可比 / 不可比&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-B05 / 隐藏测试集挡得住过拟合，挡不住训练污染&quot;,&quot;quote&quot;:&quot;如果这些题目本来就在模型的预训练语料里出现过，隐藏与否都不影响模型已经见过它们这个事实。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;candidate&quot;,&quot;title&quot;:&quot;Candidate Results&quot;},{&quot;id&quot;:&quot;compatibility&quot;,&quot;title&quot;:&quot;Version Compatibility&quot;},{&quot;id&quot;:&quot;exposure&quot;,&quot;title&quot;:&quot;Duplicate/Exposure Audit&quot;},{&quot;id&quot;:&quot;canary&quot;,&quot;title&quot;:&quot;Sealed Canary&quot;},{&quot;id&quot;:&quot;uncertainty&quot;,&quot;title&quot;:&quot;Paired Uncertainty&quot;},{&quot;id&quot;:&quot;classify&quot;,&quot;title&quot;:&quot;可信度分类&quot;},{&quot;id&quot;:&quot;owner&quot;,&quot;title&quot;:&quot;Rebaseline/Owner&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;candidate&quot;,&quot;to&quot;:&quot;compatibility&quot;,&quot;label&quot;:&quot;版本元数据&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;candidate&quot;,&quot;to&quot;:&quot;exposure&quot;,&quot;label&quot;:&quot;样本与暴露记录&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;candidate&quot;,&quot;to&quot;:&quot;canary&quot;,&quot;label&quot;:&quot;封存审计输入&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;candidate&quot;,&quot;to&quot;:&quot;uncertainty&quot;,&quot;label&quot;:&quot;逐题候选结果&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;compatibility&quot;,&quot;to&quot;:&quot;classify&quot;,&quot;label&quot;:&quot;历史可比性&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;exposure&quot;,&quot;to&quot;:&quot;classify&quot;,&quot;label&quot;:&quot;污染与未知项&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;canary&quot;,&quot;to&quot;:&quot;classify&quot;,&quot;label&quot;:&quot;泄露信号&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;uncertainty&quot;,&quot;to&quot;:&quot;classify&quot;,&quot;label&quot;:&quot;不确定性&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;classify&quot;,&quot;to&quot;:&quot;owner&quot;,&quot;label&quot;:&quot;分类与缺口&quot;,&quot;kind&quot;:&quot;control&quot;}]}</metadata>
