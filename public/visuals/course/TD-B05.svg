<text x="106" y="1393.5291700903863" font-size="25" fill="#ad3e4c" font-weight="700" >怎样分层查污染</text>
<text x="88" y="1448.5291700903863" font-size="23" fill="#172b45" font-weight="450" >逐字哈希、近重复加人工抽检</text>
