<text x="1108" y="1393.5291700903863" font-size="25" fill="#7045a4" font-weight="700" >怎样交付可信度结论</text>
<text x="1090" y="1448.5291700903863" font-size="23" fill="#172b45" font-weight="450" >每个分数带分类、区间和缺口</text>
<text x="1090" y="1483.5291700903863" font-size="23" fill="#172b45" font-weight="450" >具名 owner 决定重建与使用范围</text>
</g>
<g id="failure-and-output" data-region="64,1552.5291700903863,1472,148">
