<text x="88" y="1591.5291700903863" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1636.5291700903863" font-size="23" fill="#ffdce2" font-weight="450" >版本不兼容、封存泄露或样本不足以支撑排名时停止使用原榜单结论。</text>
<text x="88" y="1679.5291700903863" font-size="23" fill="#dce9fa" font-weight="450" >交付暴露审计、封存检查、配对区间、可信度分类和重建基线决定。</text>
