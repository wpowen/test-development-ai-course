<text x="589" y="1448.5291700903863" font-size="23" fill="#172b45" font-weight="450" >核对 dataset 与评分协议兼容</text>
<text x="589" y="1483.5291700903863" font-size="23" fill="#172b45" font-weight="450" >不兼容则重建基线后再比</text>
</g>
