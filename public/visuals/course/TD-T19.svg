<title id="title">自愈补丁先分类，再证明业务检测力保留</title><desc id="desc">纯定位器变化可成为候选；业务 Oracle 失败、改期望和跳步骤不能由 healer 修绿。 产品故障直接交人工，候选补丁通过 anti-cheat 与原变异重跑双重门禁 离线补丁门禁不证明真实 healer 误修率；检测力比较按配对变异和批准门槛。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-2.json#TD-T19 / 架构、输入契约与可观察证据;docs/svg-redesign-2026-10-26/body-sources/course-2.json#TD-T19 / 运行 baseline、故障与修复">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-T19&quot;,&quot;pageIds&quot;:[&quot;TD-T19&quot;],&quot;primaryPageIds&quot;:[&quot;TD-T19&quot;],&quot;layout&quot;:&quot;decision&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-2.json&quot;,&quot;locator&quot;:&quot;TD-T19 / 架构、输入契约与可观察证据&quot;,&quot;quote&quot;:&quot;制造纯 DOM 改名和业务按钮交换两类失败。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-2.json&quot;,&quot;locator&quot;:&quot;TD-T19 / 运行 baseline、故障与修复&quot;,&quot;quote&quot;:&quot;locator-only 候选仍须杀死原业务变异&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;fail&quot;,&quot;title&quot;:&quot;失败与 Evidence capture&quot;},{&quot;id&quot;:&quot;classify&quot;,&quot;title&quot;:&quot;失败与补丁分类&quot;},{&quot;id&quot;:&quot;candidate&quot;,&quot;title&quot;:&quot;Healer candidate&quot;},{&quot;id&quot;:&quot;diff&quot;,&quot;title&quot;:&quot;Anti-cheat diff&quot;},{&quot;id&quot;:&quot;mutation&quot;,&quot;title&quot;:&quot;Mutation rerun&quot;},{&quot;id&quot;:&quot;human&quot;,&quot;title&quot;:&quot;Human merge gate&quot;},{&quot;id&quot;:&quot;product&quot;,&quot;title&quot;:&quot;产品缺陷 / 语义不明&quot;},{&quot;id&quot;:&quot;rollback&quot;,&quot;title&quot;:&quot;拒绝并回退补丁&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;fail&quot;,&quot;to&quot;:&quot;classify&quot;,&quot;label&quot;:&quot;证据先于修复&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;classify&quot;,&quot;to&quot;:&quot;candidate&quot;,&quot;label&quot;:&quot;纯非语义表面&quot;,&quot;kind&quot;:&