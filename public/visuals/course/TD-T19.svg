<text x="88" y="2423" font-size="23" fill="#dce9fa" font-weight="450" >交付 healer 权限清单、补丁 diff、反作弊结果、变异重跑与合并裁决。</text>
</g>
<text x="64" y="2492" font-size="20" fill="#50647c" font-weight="450" >离线补丁门禁不证明真实 healer 误修率；检测力比较按配对变异和批准门槛。</text>
<text x="64" y="2531" font-size="18" fill="#50647c" font-weight="450" >对应课程：TD-T19 · 自愈补丁先分类，再证明业务检测力保留</text>
