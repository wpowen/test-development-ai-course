<title id="title">事件只触发回读，依据批准后执行</title><desc id="desc">Webhook 不拥有事实权威；回读需求、冻结依据、保留引用，再由具权限的人批准。 需求未批准、冲突未决或批准越权都在生成与执行之前停住 本图是集成合同；本地事件夹具不证明真实 Jira 权限、Webhook 验签和回写已经接通。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-QP01 / 架构节点与交付物;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-QP01 / 从需求事件到可执行方案的四道关卡;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-QP01 / 架构节点与交付物">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-QP01&quot;,&quot;pageIds&quot;:[&quot;TD-QP01&quot;],&quot;primaryPageIds&quot;:[&quot;TD-QP01&quot;],&quot;layout&quot;:&quot;sequence&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-QP01 / 架构节点与交付物&quot;,&quot;quote&quot;:&quot;webhook 只用来触发，事实一律以回读为准。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-QP01 / 从需求事件到可执行方案的四道关卡&quot;,&quot;quote&quot;:&quot;BLOCKED，附两处精确 locator&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-QP01 / 架构节点与交付物&quot;,&quot;quote&quot;:&quot;由具权限的人在明确范围内批准，批准范围随决定一起留痕&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;jira&quot;,&quot;title&quot;:&quot;Jira 需求与变更&quot;},{&quot;id&quot;:&quot;inbox&quot;,&quot;title&quot;:&quot;Webhook Gateway/Inbox&quot;},{&quot;id&quot;:&quot;readback&quot;,&quot;title&quot;:&quot;Jira REST 回读&quot;},{&quot;id&quot;:&quot;basis&quot;,&quot;title&quot;:&quot;Basis Gate/Source Pack&quot;},{&quot;id&quot;:&quot;candidate&quot;,&quot;title&quot;:&quot;AI 候选与 provenance&quot;},{&quot;id&quot;:&quot;review&quot;,&quot;title&quot;:&quot;Review Console/人工批准&quot;},{&quot;id&quot;:&quot;orchestrator&quot;,&quot;title&quot;:&quot;Orchestrator/审计与执行请求&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;jira&quot;,&quot;to&quot;:&quot;inbox&quot;,&quot;label&quot;:&quot;变更通知&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;inbox&quot;,&quot;to&quot;:&quot;readback&quot;,&quot;label&quot;:&quot;触发权威回读&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;jira&quot;,&quot;to&quot;:&quot;readback&quot;,&quot;label&quot;:&quot;当前需求与权限&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;readback&quot;,&quot;to&quot;:&quot;basis&quot;,&quot;label&quot;:&quot;回读事实与 revision&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;basis&quot;,&quot;to&quot;:&quot;candidate&quot;,&quot;label&quot;:&quot;冻结来源包&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;candidate&quot;,&quot;to&quot;:&quot;review&quot;,&quot;label&quot;:&quot;带引用候选&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;review&quot;,&quot;to&quot;:&quot;orchestrator&quot;,&quot;label&quot;:&quot;批准范围内执行&quot;,&quot;kind&quot;:&quot;control&quot;}]}</metadata>
