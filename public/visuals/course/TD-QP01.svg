<text x="64" y="53" font-size="18" fill="#215cbb" font-weight="750" class="mono">QUALITY ENGINEERING  /  TD-QP01</text>
<text x="64" y="112" font-size="40" fill="#172b45" font-weight="750" >事件只触发回读，依据批准后执行</text>
<text x="64" y="170" font-size="24" fill="#50647c" font-weight="450" >Webhook 不拥有事实权威；回读需求、冻结依据、保留引用，再由具权限的人批准。</text>
