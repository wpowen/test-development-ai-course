<title id="title">Gold 在哪一层丢失，就修哪一层</title><desc id="desc">检索和生成独立出分：先找必要证据是否存在、是否召回、如何排序及是否进入最终上下文。 Gold/qrels 约束下的召回、排序、上下文与生成故障分流 fixture mutation 不证明私有语料召回表现；公开基准阈值不可直接迁移。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-2.json#TD-T10 / Miss reason 决定修哪一层;docs/svg-redesign-2026-10-26/body-sources/course-2.json#TD-T10 / Prompt 只生成候选，Oracle 独立判定">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-T10&quot;,&quot;pageIds&quot;:[&quot;TD-T10&quot;],&quot;primaryPageIds&quot;:[&quot;TD-T10&quot;],&quot;layout&quot;:&quot;decision&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-2.json&quot;,&quot;locator&quot;:&quot;TD-T10 / Miss reason 决定修哪一层&quot;,&quot;quote&quot;:&quot;相关文档已召回但位次低则检查 ranking；文档在 Context 中仍答错才进入生成层。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-2.json&quot;,&quot;locator&quot;:&quot;TD-T10 / Prompt 只生成候选，Oracle 独立判定&quot;,&quot;quote&quot;:&quot;`relevant_doc_recalled=false` 触发 FAIL，即使最终答案可能看起来正确&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;gold&quot;,&quot;title&quot;:&quot;查询切片与版本化 qrels&quot;},{&quot;id&quot;:&quot;corpus&quot;,&quot;title&quot;:&quot;语料中有必要证据吗&quot;},{&quot;id&quot;:&quot;retrieval&quot;,&quot;title&quot;:&quot;候选召回与过滤&quot;},{&quot;id&quot;:&quot;ranking&quot;,&quot;title&quot;:&quot;Top-k 排序&quot;},{&quot;id&quot;:&quot;context&quot;,&quot;title&quot;:&quot;最终 Context&quot;},{&quot;id&quot;:&quot;generation&quot;,&quot;title&quot;:&quot;生成与引用核查&quot;},{&quot;id&quot;:&quot;miss&quot;,&quot;title&quot;:&quot;Miss reason 与 Owner&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;gold&quot;,&quot;to&quot;:&quot;corpus&quot;,&quot;label&quot;:&quot;查必要证据&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;corpus&quot;,&quot;to&quot;:&quot;retrieval&quot;,&quot;label&quot;:&quot;存在于当前语料&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;corpus&quot;,&quot;to&quot;:&quot;miss&quot;,&quot;label&quot;:&quot;不存在&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;gold&quot;,&quot;to&quot;:&quot;retrieval&quot;,&quot;label&quot;:&quot;独立 relevant 判断&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;retrieval&quot;,&quot;to&quot;:&quot;ranking&quot;,&quot;label&quot;:&quot;候选已召回&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;retrieval&quot;,&quot;to&quot;:&quot;miss&quot;,&quot;label&quot;:&quot;未召回 / 过滤误伤&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;ranking&quot;,&quot;to&quot;:&quot;context&quot;,&quot;label&quot;:&quot;最终 top-k&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;ranking&quot;,&quot;to&quot;:&quot;miss&quot;,&quot;label&quot;:&quot;排序压出窗口&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;context&quot;,&quot;to&quot;:&quot;generation&quot;,&quot;label&quot;:&quot;上下文充分再测生成&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;context&quot;,&quot;to&quot;:&quot;miss&quot;,&quot;label&quot;:&quot;组装丢失&quot;,&quot;kind&quot;:&quot;risk&quot;}]}</metadata>
