<text x="88" y="1447.5023858214042" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1492.5023858214042" font-size="23" fill="#ffdce2" font-weight="450" >缺 terminal 判业务 UNKNOWN；span 与 ledger 不一致先修 writer/collector，禁止报表伪造 parent。</text>
<text x="88" y="1535.5023858214042" font-size="23" fill="#dce9fa" font-weight="450" >交付 root-to-terminal 图、字段缺口卡、脱敏策略与最小修复后的重放样例。</text>
