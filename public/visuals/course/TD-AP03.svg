<title id="title">父子闭包与账本共同校验 Trace</title><desc id="desc">任务根关联每次物理尝试；终态与账本可回读，才有故障归因和重放依据。 边表示归属与证据核对，不把 span 树误画成调用先后 本地闭包不证明真实 telemetry 已接入；provider/model、集成与生产观测均 NOT_RUN。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-AP03 / 架构节点与交付物;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-AP03 / AP03 Project lab：Trace 闭包与重放审计;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-AP03 / AP03 最终练习：修复一条断链 Trace">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-AP03&quot;,&quot;pageIds&quot;:[&quot;TD-AP03&quot;],&quot;primaryPageIds&quot;:[&quot;TD-AP03&quot;],&quot;layout&quot;:&quot;layers&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-AP03 / 架构节点与交付物&quot;,&quot;quote&quot;:&quot;一个任务一个根，排队、生成、工具尝试各自成子 span，终态作为事件落在根上。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-AP03 / AP03 Project lab：Trace 闭包与重放审计&quot;,&quot;quote&quot;:&quot;tool attempt 必须与 ledger 调用数相等&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-AP03 / AP03 最终练习：修复一条断链 Trace&quot;,&quot;quote&quot;:&quot;不能通过删除失败 span 让图看起来完整。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;root&quot;,&quot;title&quot;:&quot;invoke_agent root&quot;},{&quot;id&quot;:&quot;queue&quot;,&quot;title&quot;:&quot;queue.wait span&quot;},{&quot;id&quot;:&quot;generation&quot;,&quot;title&quot;:&quot;generation span&quot;},{&quot;id&quot;:&quot;attempt&quot;,&quot;title&quot;:&quot;tool / retry attempt&quot;},{&quot;id&quot;:&quot;terminal&quot;,&quot;title&quot;:&quot;task.finalize event&quot;},{&quot;id&quot;:&quot;ledger&quot;,&quot;title&quot;:&quot;Attempt ledger&quot;},{&quot;id&quot;:&quot;closure&quot;,&quot;title&quot;:&quot;闭包与重放审计&quot;}],&quot;edges&quot;:[{&quot;from