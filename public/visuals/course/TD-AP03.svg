<text x="1090" y="1269.5023858214042" font-size="23" fill="#172b45" font-weight="450" >高危动作全量保留可审计轨迹</text>
<text x="1090" y="1304.5023858214042" font-size="23" fill="#172b45" font-weight="450" >提交 schema diff、隐私表与 replay</text>
<text x="1090" y="1339.5023858214042" font-size="23" fill="#172b45" font-weight="450" >case</text>
