<text x="607" y="1214.5023858214042" font-size="25" fill="#344f70" font-weight="700" >怎样定位责任层</text>
<text x="589" y="1269.5023858214042" font-size="23" fill="#172b45" font-weight="450" >先传播与采集，再存储和采样</text>
<text x="589" y="1304.5023858214042" font-size="23" fill="#172b45" font-weight="450" >比对 collector receipt 与账本</text>
</g>
