<title id="title">事故先隔离再变成有检测力的回归</title><desc id="desc">保留首错触发条件，脱敏后固定 Oracle；原故障会红且修复会绿，事件才可关闭。 过期退款政策触发错误工具候选的最小重放链 合成 Trace 只证明离线回归结构；真实数据审批、真实模型工具与生产事故闭环需另验。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-T22 / Trace-to-Regression 实操：从一条事故到稳定回归;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-T22 / 回灌六步与各自的产出;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-T22 / 架构节点与交付物">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-T22&quot;,&quot;pageIds&quot;:[&quot;TD-T22&quot;],&quot;primaryPageIds&quot;:[&quot;TD-T22&quot;],&quot;layout&quot;:&quot;flow&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-T22 / Trace-to-Regression 实操：从一条事故到稳定回归&quot;,&quot;quote&quot;:&quot;故意让检索返回过期文档，确认工具授权 blocker 变红&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-T22 / 回灌六步与各自的产出&quot;,&quot;quote&quot;:&quot;在缺陷版本上跑，确认这条用例会红&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-T22 / 架构节点与交付物&quot;,&quot;quote&quot;:&quot;只有回归用例入库并通过后，事件才允许关闭&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;trace&quot;,&quot;title&quot;:&quot;生产 Trace 隔离区&quot;},{&quot;id&quot;:&quot;redact&quot;,&quot;title&quot;:&quot;字段分类/脱敏&quot;},{&quot;id&quot;:&quot;minimal&quot;,&quot;title&quot;:&quot;最小失败抽取&quot;},{&quot;id&quot;:&quot;oracle&quot;,&quot;title&quot;:&quot;业务/安全 Oracle&quot;},{&quot;id&quot;:&quot;dataset&quot;,&quot;title&quot;:&quot;Regression Dataset&quot;},{&quot;id&quot;:&quot;replay&quot;,&quot;title&quot;:&quot;CI 重放&quot;},{&quot;id&quot;:&quot;closure&quot;,&quot;title&quot;:&quot;修复与事件 Closure&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;trace&quot;,&quot;to&quot;:&quot;redact&quot;,&quot;label&quot;:&quot;受控脱敏&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;redact&quot;,&quot;to&quot;:&quot;minimal&quot;,&quot;label&quot;:&quot;保留必要字段&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;minimal&quot;,&quot;to&quot;:&quot;oracle&quot;,&quot;label&quot;:&quot;定义失败不变量&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;minimal&quot;,&quot;to&quot;:&quot;dataset&quot;,&quot;label&quot;:&quot;最小可重放输入&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;oracle&quot;,&quot;to&quot;:&quot;dataset&quot;,&quot;label&quot;:&quot;绑定独立判据&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;dataset&quot;,&quot;to&quot;:&quot;replay&quot;,&quot;label&quot;:&quot;缺陷与修复双验证&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;replay&quot;,&quot;to&quot;:&quot;closure&quot;,&quot;label&quot;:&quot;红绿证据与 receipt&quot;,&quot;kind&quot;:&quot;evidence&quot;}]}</metadata>
