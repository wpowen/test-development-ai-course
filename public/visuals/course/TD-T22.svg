<text x="64" y="53" font-size="18" fill="#215cbb" font-weight="750" class="mono">QUALITY ENGINEERING  /  TD-T22</text>
<text x="64" y="112" font-size="40" fill="#172b45" font-weight="750" >事故先隔离再变成有检测力的回归</text>
