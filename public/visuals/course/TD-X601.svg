<title id="title">最坏切片与人工纠错共同裁决</title><desc id="desc">先定义伤害与合法切片，再把最坏组和独立人工复核交给具名负责人。 分组结果与人工样本是两条证据，平均分不能抵消 blocker 图示控制方法不证明已完成真实人群公平性评审；切片合法性和风险界须由业务与合规确认。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-X601 / 架构节点与交付物;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-X601 / 完成标准与停止条件">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-X601&quot;,&quot;pageIds&quot;:[&quot;TD-X601&quot;],&quot;primaryPageIds&quot;:[&quot;TD-X601&quot;],&quot;layout&quot;:&quot;decision&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-X601 / 架构节点与交付物&quot;,&quot;quote&quot;:&quot;独立随机抽样供人工复核，不由系统置信度筛选&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-X601 / 完成标准与停止条件&quot;,&quot;quote&quot;:&quot;最差切片超过预注册 blocker 界时阻断发布；总体平均分折抵次数 = 0&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;harm&quot;,&quot;title&quot;:&quot;使用情境/伤害模型&quot;},{&quot;id&quot;:&quot;slice&quot;,&quot;title&quot;:&quot;合法切片&quot;},{&quot;id&quot;:&quot;groups&quot;,&quot;title&quot;:&quot;分组结果&quot;},{&quot;id&quot;:&quot;worst&quot;,&quot;title&quot;:&quot;最坏切片/Blocker&quot;},{&quot;id&quot;:&quot;human&quot;,&quot;title&quot;:&quot;独立人工样本&quot;},{&quot;id&quot;:&quot;appeal&quot;,&quot;title&quot;:&quot;分歧/申诉&quot;},{&quot;id&quot;:&quot;decision&quot;,&quot;title&quot;:&quot;具名决定&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;harm&quot;,&quot;to&quot;:&quot;slice&quot;,&quot;label&quot;:&quot;依据伤害划分&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;slice&quot;,&quot;to&quot;:&quot;groups&quot;,&quot;label&quot;:&quot;按组统计&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;groups&quot;,&quot;to&quot;:&quot;worst&quot;,&quot;label&quot;:&quot;取最坏组&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot