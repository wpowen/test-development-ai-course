<title id="title">同一候选在正常代码与变异代码上对照</title><desc id="desc">先证明批准实现上通过，再证明已知守卫被破坏时，相关断言确实变红。 Baseline 与 Mutation 共用独立期望，分别回答能跑通和能杀错 0→1→0 只覆盖合成守卫；真实模型生成、仓库变异成本与生产效果 NOT_RUN。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-2.json#TD-T06 / 架构节点与交付物;docs/svg-redesign-2026-10-26/body-sources/course-2.json#TD-T06 / 工作示例">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-T06&quot;,&quot;pageIds&quot;:[&quot;TD-T06&quot;],&quot;primaryPageIds&quot;:[&quot;TD-T06&quot;],&quot;layout&quot;:&quot;comparison&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-2.json&quot;,&quot;locator&quot;:&quot;TD-T06 / 架构节点与交付物&quot;,&quot;quote&quot;:&quot;Baseline 证明测试在正常代码上是绿的，Mutation 证明它在被破坏的代码上会红。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-2.json&quot;,&quot;locator&quot;:&quot;TD-T06 / 工作示例&quot;,&quot;quote&quot;:&quot;目标用例必须因为 actual 与 independent expected 不同而 KILLED，不能因为无关超时而变红。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;oracle&quot;,&quot;title&quot;:&quot;独立行为 Oracle&quot;},{&quot;id&quot;:&quot;candidate&quot;,&quot;title&quot;:&quot;AI 测试候选&quot;},{&quot;id&quot;:&quot;base&quot;,&quot;title&quot;:&quot;Baseline Runner&quot;},{&quot;id&quot;:&quot;mutate&quot;,&quot;title&quot;:&quot;Mutation Runner&quot;},{&quot;id&quot;:&quot;detect&quot;,&quot;title&quot;:&quot;目标行为检测&quot;},{&quot;id&quot;:&quot;classify&quot;,&quot;title&quot;:&quot;未杀死项分类&quot;},{&quot;id&quot;:&quot;review&quot;,&quot;title&quot;:&quot;Reviewer 处置&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;candidate&quot;,&quot;to&quot;:&quot;base&quot;,&quot;label&quot;:&quot;正常代码&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;candidate&quot;,&quot;to&quot;:&quot;mutate&quot;,&quot;label&quot;:&quot;相同候选&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;oracle&quot;,&quot;to&quot;:&quot;base&quot;,&quot;label&quot;:&quot;固定期望&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;oracle&quot;,&quot;to&quot;:&quot;detect&quot;,&quot;label&quot;:&quot;独立判据&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;base&quot;,&quot;to&quot;:&quot;mutate&quot;,&quot;label&quot;:&quot;仅 baseline 全绿后&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;mutate&quot;,&quot;to&quot;:&quot;detect&quot;,&quot;label&quot;:&quot;变异运行证据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;detect&quot;,&quot;to&quot;:&quot;review&quot;,&quot;label&quot;:&quot;相关断言杀死&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;detect&quot;,&quot;to&quot;:&quot;classify&quot;,&quot;label&quot;:&quot;未杀死 / 不确定&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;classify&quot;,&quot;to&quot;:&quot;review&quot;,&quot;label&quot;:&quot;逐项归因与处置&quot;,&quot;kind&quot;:&quot;data&quot;}]}</metadata>
