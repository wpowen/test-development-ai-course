<text x="589" y="2150" font-size="23" fill="#172b45" font-weight="450" >按任务类型和 token 桶报告</text>
<text x="589" y="2185" font-size="23" fill="#172b45" font-weight="450" >保留 p90/p99 与工具路径尾部</text>
