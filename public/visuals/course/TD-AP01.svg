<title id="title">任务分布与终态共同定义负载</title><desc id="desc">容量结论先绑定任务分母、风险切片和业务 Oracle，再绑定 workload hash。 退款、查询、转人工分别保留工具路径与允许终态 示例任务分布只证明 fixture 检测力；真实样本、provider/model、集成与生产容量均 NOT_RUN。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-AP01 / AP01 Project lab：从业务样本生成负载契约;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-AP01 / AP01 验收标准;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-AP01 / 建 workload 时必须分开建模的六个变量">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-AP01&quot;,&quot;pageIds&quot;:[&quot;TD-AP01&quot;],&quot;primaryPageIds&quot;:[&quot;TD-AP01&quot;],&quot;layout&quot;:&quot;evidence&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-AP01 / AP01 Project lab：从业务样本生成负载契约&quot;,&quot;quote&quot;:&quot;故障注入缺 Oracle、错误终态和缺 slice 三种 mutation&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-AP01 / AP01 验收标准&quot;,&quot;quote&quot;:&quot;缺 Oracle 的样本不能被写入成功率。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-AP01 / 建 workload 时必须分开建模的六个变量&quot;,&quot;quote&quot;:&quot;六个变量都要写进版本化 workload 文件并打 hash&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;sample&quot;,&quot;title&quot;:&quot;脱敏任务样本&quot;},{&quot;id&quot;:&quot;refund&quot;,&quot;title&quot;:&quot;退款切片&quot;},{&quot;id&quot;:&quot;query&quot;,&quot;title&quot;:&quot;查询切片&quot;},{&quot;id&quot;:&quot;handoff&quot;,&quot;title&quot;:&quot;转人工切片&quot;},{&quot;id&quot;:&quot;oracle&quot;,&quot;title&quot;:&quot;业务终态 Oracle&quot;},{&quot;id&quot;:&quot;profile&quot;,&quot;title&quot;:&quot;版本化 workload&quot;},{&quot;id&quot;:&quot;gate&quot;,&quot;title&quot;:&quot;压测前提检查&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;sample&quot;,&quot;to&quot;:&quot;refund&quot;,&quot;label&quot;:&quot;分层&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;sample&quot;,&quot;to&quot;:&quot;query&quot;,&quot;label&quot;:&quot;分层&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;sample&quot;,&quot;to&quot;:&quot;handoff&quot;,&quot;label&quot;:&quot;分层&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;refund&quot;,&quot;to&quot;:&quot;oracle&quot;,&quot;label&quot;:&quot;账本与终态&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;query&quot;,&quot;to&quot;:&quot;oracle&quot;,&quot;label&quot;:&quot;引用与终态&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;handoff&quot;,&quot;to&quot;:&quot;oracle&quot;,&quot;label&quot;:&quot;升级记录&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;sample&quot;,&quot;to&quot;:&quot;profile&quot;,&quot;label&quot;:&quot;样本分布&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;oracle&quot;,&quot;to&quot;:&quot;profile&quot;,&quot;label&quot;:&quot;绑定成功定义&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;profile&quot;,&quot;to&quot;:&quot;gate&quot;,&quot;label&quot;:&quot;带 hash 的合同&quot;,&quot;kind&quot;:&quot;evidence&quot;}]}</metadata>
