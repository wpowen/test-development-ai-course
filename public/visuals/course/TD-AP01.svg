<rect x="585" y="1209.6883087656126" width="7" height="30" rx="3" fill="#087b76" stroke="none" />
<text x="607" y="1234.6883087656126" font-size="25" fill="#087b76" font-weight="700" >怎样避免平均值假绿</text>
<text x="589" y="1289.6883087656126" font-size="23" fill="#172b45" font-weight="450" >按任务类型和 token 桶报告</text>
<text x="589" y="1324.6883087656126" font-size="23" fill="#172b45" font-weight="450" >保留 p90/p99 与工具路径尾部</text>
</g>
<g id="detail-2" data-region="1066,1187.6883087656126,470,174">
