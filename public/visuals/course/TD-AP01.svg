<text x="106" y="2095" font-size="25" fill="#ad3e4c" font-weight="700" >怎样打破负载合同</text>
<text x="88" y="2150" font-size="23" fill="#172b45" font-weight="450" >分别注入缺 slice、缺 Oracle</text>
<text x="88" y="2185" font-size="23" fill="#172b45" font-weight="450" >再注入错误终态，保留原分母</text>
