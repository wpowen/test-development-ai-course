<rect x="1086" y="1209.6883087656126" width="7" height="30" rx="3" fill="#7045a4" stroke="none" />
<text x="1108" y="1234.6883087656126" font-size="25" fill="#7045a4" font-weight="700" >怎样交给下一次实验</text>
<text x="1090" y="1289.6883087656126" font-size="23" fill="#172b45" font-weight="450" >交付 sample ledger 与 Oracle 卡</text>
<text x="1090" y="1324.6883087656126" font-size="23" fill="#172b45" font-weight="450" >报告引用 profile hash 和排除原因</text>
</g>
<g id="failure-and-output" data-region="64,1393.6883087656126,1472,148">
<rect x="64" y="1393.6883087656126" width="1472" height="148" rx="14" fill="#172e4c" stroke="none" />
<text x="88" y="1432.6883087656126" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1477.6883087656126" font-size="23" fill="#ffdce2" font-weight="450" >fault 未被识别时回查分母、profile 版本与 mutation，不通过加大 QPS 或放宽规则修复。</text>
<text x="88" y="1520.6883087656126" font-size="23" fill="#dce9fa" font-weight="450" >交付 workload、切片比例、终态 owner 与变更记录，作为后续性能实验前提。</text>
</g>
<text x="64" y="1589.6883087656126" font-size="20" fill="#50647c" font-weight="450" >示例任务分布只证明 fixture 检测力；真实样本、provider/model、集成与生产容量均 NOT_RUN。</text>
<text x="64" y="1628.6883087656126" font-size="18" fill="#50647c" font-weight="450" >对应课程：TD-AP01 · 任务分布与终态共同定义负载</text>
