<text x="88" y="2293" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="2338" font-size="23" fill="#ffdce2" font-weight="450" >fault 未被识别时回查分母、profile 版本与 mutation，不通过加大 QPS 或放宽规则修复。</text>
<text x="88" y="2381" font-size="23" fill="#dce9fa" font-weight="450" >交付 workload、切片比例、终态 owner 与变更记录，作为后续性能实验前提。</text>
