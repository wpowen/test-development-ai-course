<rect x="84" y="1209.6883087656126" width="7" height="30" rx="3" fill="#ad3e4c" stroke="none" />
<text x="106" y="1234.6883087656126" font-size="25" fill="#ad3e4c" font-weight="700" >怎样打破负载合同</text>
<text x="88" y="1289.6883087656126" font-size="23" fill="#172b45" font-weight="450" >分别注入缺 slice、缺 Oracle</text>
<text x="88" y="1324.6883087656126" font-size="23" fill="#172b45" font-weight="450" >再注入错误终态，保留原分母</text>
</g>
<g id="detail-1" data-region="565,1187.6883087656126,470,174">
