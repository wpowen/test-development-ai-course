<rect x="585" y="1597.5318945987838" width="7" height="30" rx="3" fill="#ad3e4c" stroke="none" />
<text x="607" y="1622.5318945987838" font-size="25" fill="#ad3e4c" font-weight="700" >首败也是事实</text>
<text x="589" y="1677.5318945987838" font-size="23" fill="#172b45" font-weight="450" >重试成功不能覆盖第一次失败</text>
<text x="589" y="1712.5318945987838" font-size="23" fill="#172b45" font-weight="450" >间歇复现写 M/N，不只写偶现</text>
</g>
<g id="detail-2" data-region="1066,1575.5318945987838,470,209">
