<text x="1108" y="1622.5318945987838" font-size="25" fill="#945c0b" font-weight="700" >UNKNOWN 要能行动</text>
<text x="1090" y="1677.5318945987838" font-size="23" fill="#172b45" font-weight="450" >写缺哪个版本、日志或依赖状态</text>
<text x="1090" y="1712.5318945987838" font-size="23" fill="#172b45" font-weight="450" >指定补证实验后再决定是否重跑</text>
</g>
<g id="failure-and-output" data-region="64,1816.5318945987838,1472,148">
<rect x="64" y="1816.5318945987838" width="1472" height="148" rx="14" fill="#172e4c" stroke="none" />
<text x="88" y="1855.5318945987838" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1900.5318945987838" font-size="23" fill="#ffdce2" font-weight="450" >缺 pinned input、选择集、重试或 raw evidence 时，不能判为产品缺陷或发布通过。</text>
<text x="88" y="1943.5318945987838" font-size="23" fill="#dce9fa" font-weight="450" >交付 Run Manifest、分类依据、补证清单与前后版本收据。</text>
</g>
<text x="64" y="2012.5318945987838" font-size="20" fill="#50647c" font-weight="450" >正文离线三相结果不是生产根因证据；五层无法区分时保持 UNKNOWN。</text>
