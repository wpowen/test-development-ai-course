<text x="106" y="1622.5318945987838" font-size="25" fill="#7045a4" font-weight="700" >三段收据不能少</text>
<text x="88" y="1677.5318945987838" font-size="23" fill="#172b45" font-weight="450" >同一契约下 baseline→fault→repair</text>
<text x="88" y="1712.5318945987838" font-size="23" fill="#172b45" font-weight="450" >记录 fault 命中的</text>
<text x="88" y="1747.5318945987838" font-size="23" fill="#172b45" font-weight="450" >failed_oracle_ids</text>
</g>
<g id="detail-1" data-region="565,1575.5318945987838,470,209">
