<title id="title">先冻结运行事实，再给失败归因</title><desc id="desc">版本、选择集、Oracle、actual 与 Trace 齐全才支持归因；证据不足必须成为可行动的 UNKNOWN。 一份失败报告怎样分流到产品、脚本、环境依赖或补证 正文离线三相结果不是生产根因证据；五层无法区分时保持 UNKNOWN。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-1.json#TD-P07 / 失败先分类，修复 Agent 才能被约束;docs/svg-redesign-2026-10-26/body-sources/course-1.json#TD-P07 / TD-P07 反例与诊断：归因前先冻结运行事实">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-P07&quot;,&quot;pageIds&quot;:[&quot;TD-P07&quot;],&quot;primaryPageIds&quot;:[&quot;TD-P07&quot;],&quot;layout&quot;:&quot;decision&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-1.json&quot;,&quot;locator&quot;:&quot;TD-P07 / 失败先分类，修复 Agent 才能被约束&quot;,&quot;quote&quot;:&quot;没有足够证据时保持 UNKNOWN&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-1.json&quot;,&quot;locator&quot;:&quot;TD-P07 / TD-P07 反例与诊断：归因前先冻结运行事实&quot;,&quot;quote&quot;:&quot;归因顺序是版本与选择、Oracle 与 actual、环境/依赖、产品行为&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;manifest&quot;,&quot;title&quot;:&quot;固定 Run Manifest&quot;},{&quot;id&quot;:&quot;raw&quot;,&quot;title&quot;:&quot;原始比较证据&quot;},{&quot;id&quot;:&quot;classify&quot;,&quot;title&quot;:&quot;按证据分流&quot;},{&quot;id&quot;:&quot;product&quot;,&quot;title&quot;:&quot;PRODUCT_FAIL&quot;},{&quot;id&quot;:&quot;test&quot;,&quot;title&quot;:&quot;TEST_FAIL&quot;},{&quot;id&quot;:&quot;environment&quot;,&quot;title&quot;:&quot;环境 / 依赖阻断&quot;},{&quot;id&quot;:&quot;unknown&quot;,&quot;title&quot;:&quot;UNKNOWN 与补证清单&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;manifest&quot;,&quot;to&quot;:&quot;classify&quot;,&quot;label&quot;:&quot;可重放上下文&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;raw&quot;,&quot;to&quot;:&quot;classify&quot;,&quot;label&quot;:&quot;可核对事实&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;classify&quot;,&quot;to&quot;:&quot;product&quot;,&quot;label&quot;:&quot;产品违背独立判据&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;classify&quot;,&quot;to&quot;:&quot;test&quot;,&quot;label&quot;:&quot;测试装置错误&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;classify&quot;,&quot;to&quot;:&quot;environment&quot;,&quot;label&quot;:&quot;环境或依赖证据&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;classify&quot;,&quot;to&quot;:&quot;unknown&quot;,&quot;label&quot;:&quot;关键证据不足&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;unknown&quot;,&quot;to&quot;:&quot;raw&quot;,&quot;label&quot;:&quot;补证后重新分类&quot;,&quot;kind&quot;:&quot;feedback&quot;}]}</metadata>
