<title id="title">同负载三维硬门禁后再选 Pareto</title><desc id="desc">质量、延迟、单位成功成本分别达标，才允许具名 owner 在合格候选中做取舍。 三个观测分支共同约束候选，不把它们合成可互相抵消的总分 本图没有性能测量值；阈值由目标业务合同确定，离线候选排序不等于生产容量验收。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-T23 / 架构节点与交付物;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-T23 / 三个维度各自的判据与它们的冲突点">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-T23&quot;,&quot;pageIds&quot;:[&quot;TD-T23&quot;],&quot;primaryPageIds&quot;:[&quot;TD-T23&quot;],&quot;layout&quot;:&quot;metric&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-T23 / 架构节点与交付物&quot;,&quot;quote&quot;:&quot;三维各设独立硬阈值，通过后再看 Pareto 前沿&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-T23 / 三个维度各自的判据与它们的冲突点&quot;,&quot;quote&quot;:&quot;三个维度必须在同一份负载上测量，否则数字之间不可比较。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;workload&quot;,&quot;title&quot;:&quot;版本化 Workload&quot;},{&quot;id&quot;:&quot;candidates&quot;,&quot;title&quot;:&quot;模型/路由候选&quot;},{&quot;id&quot;:&quot;quality&quot;,&quot;title&quot;:&quot;质量 Scorer&quot;},{&quot;id&quot;:&quot;latency&quot;,&quot;title&quot;:&quot;Trace/延迟分解&quot;},{&quot;id&quot;:&quot;cost&quot;,&quot;title&quot;:&quot;Token/成本账本&quot;},{&quot;id&quot;:&quot;pareto&quot;,&quot;title&quot;:&quot;硬门禁/Pareto&quot;},{&quot;id&quot;:&quot;owners&quot;,&quot;title&quot;:&quot;容量与产品 Owner&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;workload&quot;,&quot;to&quot;:&quot;candidates&quot;,&quot;label&quot;:&quot;同一负载&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;candidates&quot;,&quot;to&quot;:&quot;quality&quot;,&quot;label&quot;:&quot;质量观测&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;candidates&quot;,&quot;to&quot;:&quot;latency&quot;,&quot;label&quot;:&quot;时间观测&quo