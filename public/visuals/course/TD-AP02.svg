<text x="1090" y="1321.3894439873045" font-size="23" fill="#172b45" font-weight="450" >先查副作用、重试预算和等待</text>
<text x="1090" y="1356.3894439873045" font-size="23" fill="#172b45" font-weight="450" >裸 QPS 涨而 good-task 降则阻断</text>
