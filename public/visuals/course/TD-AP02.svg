<text x="88" y="1464.3894439873045" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1509.3894439873045" font-size="23" fill="#ffdce2" font-weight="450" >缺少阶段字段或把并行 span 相加时停止性能归因；先补观测，再决定优化对象。</text>
<text x="88" y="1552.3894439873045" font-size="23" fill="#dce9fa" font-weight="450" >交付指标卡、分列时间线、分桶结果与复验证据。</text>
