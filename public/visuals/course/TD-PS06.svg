<text x="64" y="53" font-size="18" fill="#215cbb" font-weight="750" class="mono">QUALITY ENGINEERING  /  TD-PS06</text>
<text x="64" y="112" font-size="40" fill="#172b45" font-weight="750" >生命周期被打断，库存仍只入账一次</text>
<text x="64" y="170" font-size="24" fill="#50647c" font-weight="450" >客户端恢复与服务端幂等共同保护扫描状态；界面恢复不能替代库存账本对账。</text>
