<title id="title">生命周期被打断，库存仍只入账一次</title><desc id="desc">客户端恢复与服务端幂等共同保护扫描状态；界面恢复不能替代库存账本对账。 Android 扫码收货从本地队列、进程中断到重放与库存确认 未连接设备时不宣称兼容性；模拟器结果不能升级为真机或生产验证。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-1.json#TD-PS06 / 场景：仓库收货不能丢扫描状态;docs/svg-redesign-2026-10-26/body-sources/course-1.json#TD-PS06 / 重放 Android 生命周期且不重复入账">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-PS06&quot;,&quot;pageIds&quot;:[&quot;TD-PS06&quot;],&quot;primaryPageIds&quot;:[&quot;TD-PS06&quot;],&quot;layout&quot;:&quot;state&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-1.json&quot;,&quot;locator&quot;:&quot;TD-PS06 / 场景：仓库收货不能丢扫描状态&quot;,&quot;quote&quot;:&quot;服务端以幂等 receipt_id 作为独立 Oracle&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-1.json&quot;,&quot;locator&quot;:&quot;TD-PS06 / 重放 Android 生命周期且不重复入账&quot;,&quot;quote&quot;:&quot;权限拒绝不创建记录&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;permission&quot;,&quot;title&quot;:&quot;相机权限检查&quot;},{&quot;id&quot;:&quot;scan&quot;,&quot;title&quot;:&quot;扫描状态已保存&quot;},{&quot;id&quot;:&quot;queue&quot;,&quot;title&quot;:&quot;离线本地队列&quot;},{&quot;id&quot;:&quot;interrupt&quot;,&quot;title&quot;:&quot;旋转 / 后台 / 回收&quot;},{&quot;id&quot;:&quot;restore&quot;,&quot;title&quot;:&quot;恢复或安全终止&quot;},{&quot;id&quot;:&quot;sync&quot;,&quot;title&quot;:&quot;库存 API 同步&quot;},{&quot;id&quot;:&quot;ledger&quot;,&quot;title&quot;:&quot;库存账本 Oracle&quot;},{&quot;id&quot;:&quot;logs&quot;,&quot;title&quot;:&quot;设备与服务证据&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;permission&quot;,&quot;to&quot;:&quot;scan&quot;,&quot;label&quot;:&quot;获授权后扫描&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;scan&quot;,&quot;to&quot;:&quot;queue&quot;,&quot;label&quot;:&quot;持久化输入&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;queue&quot;,&quot;to&quot;:&quo