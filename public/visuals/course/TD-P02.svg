<text x="64" y="53" font-size="18" fill="#215cbb" font-weight="750" class="mono">QUALITY ENGINEERING  /  TD-P02</text>
<text x="64" y="112" font-size="40" fill="#172b45" font-weight="750" >合法 JSON 还要过语义门禁</text>
<text x="64" y="170" font-size="24" fill="#50647c" font-weight="450" >契约字段从下游能力倒推；格式通过与来源、业务含义获准必须分别留痕。</text>
