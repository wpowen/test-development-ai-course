<title id="title">合法 JSON 还要过语义门禁</title><desc id="desc">契约字段从下游能力倒推；格式通过与来源、业务含义获准必须分别留痕。 把取消需求拆成可消费字段，用无来源退款时限检验两道门 契约夹具与负控制不证明真实模型理解正确；真实模型执行仍为 NOT_RUN。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-1.json#TD-P02 / 结构化输出只解决格式，不保证业务语义;docs/svg-redesign-2026-10-26/body-sources/course-1.json#TD-P02 / 阶段契约：S2 的字段不是为了好看，是为了支撑下游能力">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-P02&quot;,&quot;pageIds&quot;:[&quot;TD-P02&quot;],&quot;primaryPageIds&quot;:[&quot;TD-P02&quot;],&quot;layout&quot;:&quot;evidence&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-1.json&quot;,&quot;locator&quot;:&quot;TD-P02 / 结构化输出只解决格式，不保证业务语义&quot;,&quot;quote&quot;:&quot;结构化输出只解决格式，不保证业务语义&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-1.json&quot;,&quot;locator&quot;:&quot;TD-P02 / 阶段契约：S2 的字段不是为了好看，是为了支撑下游能力&quot;,&quot;quote&quot;:&quot;结构门禁 PASS_SCHEMA 与语义门禁 PASS_SEMANTIC 分别执行并分别留痕&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;basis&quot;,&quot;title&quot;:&quot;冻结需求依据&quot;},{&quot;id&quot;:&quot;contract&quot;,&quot;title&quot;:&quot;候选需求契约&quot;},{&quot;id&quot;:&quot;schema&quot;,&quot;title&quot;:&quot;PASS_SCHEMA&quot;},{&quot;id&quot;:&quot;semantic&quot;,&quot;title&quot;:&quot;独立语义审查&quot;},{&quot;id&quot;:&quot;mutation&quot;,&quot;title&quot;:&quot;坏契约注入&quot;},{&quot;id&quot;:&quot;unknown&quot;,&quot;title&quot;:&quot;UNKNOWN / BLOCKED&quot;},{&quot;id&quot;:&quot;consumer&quot;,&quot;title&quot;:&quot;获准字段交给下游&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;basis&quot;,&quot;to&quot;:&quot;contract&quot;,&quot;label&quot;:&quot;受约束提取&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;contract&quot;,&quot;to&quot;:&quot;schema&quot;,&quot;label&quot;:&quot;格式校验&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;contract&quot;,&quot;to&quot;:&quot;semantic&quot;,&quot;label&quot;:&quot;语义与引用&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;basis&quot;,&quot;to&quot;:&quot;semantic&quot;,&quot;label&quot;:&quot;独立依据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;mutation&quot;,&quot;to&quot;:&quot;semantic&quot;,&quot;label&quot;:&quot;格式可过，语义应红&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;semantic&quot;,&quot;to&quot;:&quot;unknown&quot;,&quot;label&quot;:&quot;无依据或未批准&quot;,&quot;kind&quot;:&quot;risk&quot;},{&quot;from&quot;:&quot;schema&quot;,&quot;to&quot;:&quot;consumer&quot;,&quot;label&quot;:&quot;结构收据&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;semantic&quot;,&quot;to&quot;:&quot;consumer&quot;,&quot;label&quot;:&quot;人工确认后交接&quot;,&quot;kind&quot;:&quot;control&quot;}]}</metadata>
