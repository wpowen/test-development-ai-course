<title id="title">容量取首个失败前的稳定台阶</title><desc id="desc">固定 workload 与 SLO，阶梯加压找首个失败门禁，再用单变量复跑确认瓶颈。 区分最高吞吐、SLO 失败点与可用容量候选 synthetic goodput 只适用于声明的夹具条件；真实业务及 production capacity 均 NOT_RUN。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-AP05 / 先理解系统边界与假绿;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-AP05 / AP05 验收标准;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-AP05 / AP05 Project lab：SLO 阶梯容量卡">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-AP05&quot;,&quot;pageIds&quot;:[&quot;TD-AP05&quot;],&quot;primaryPageIds&quot;:[&quot;TD-AP05&quot;],&quot;layout&quot;:&quot;metric&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-AP05 / 先理解系统边界与假绿&quot;,&quot;quote&quot;:&quot;前一稳定阶梯才是当前夹具的可持续点。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-AP05 / AP05 验收标准&quot;,&quot;quote&quot;:&quot;最大吞吐不能替代容量。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-AP05 / AP05 Project lab：SLO 阶梯容量卡&quot;,&quot;quote&quot;:&quot;随后只改变 queue、batch、缓存或工具中的一个变量&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;fixed&quot;,&quot;title&quot;:&quot;固定实验条件&quot;},{&quot;id&quot;:&quot;steps&quot;,&quot;title&quot;:&quot;Open arrival 阶梯&quot;},{&quot;id&quot;:&quot;signals&quot;,&quot;title&quot;:&quot;各阶段观测信号&quot;},{&quot;id&quot;:&quot;first&quot;,&quot;title&quot;:&quot;首个失败门禁&quot;},{&quot;id&quot;:&quot;capacity&quot;,&quot;title&quot;:&quot;前一稳定台阶&quot;},{&quot;id&quot;:&quot;hypothesis&quot;,&quot;title&quot;:&quot;瓶颈候选&quot;},{&quot;id&quot;:&quot;rerun&quot;,&quot;title&quot;:&quot;单变量复跑&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;fixed&quot;,&quot;to&quot;:&quot;steps&quot;,&quot;label&quot;:&quot;锁定条件&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;steps&quot;,&quot;to&quot;:&quot;signals&quot;,&quot;label&quot;:&quot;每档观测&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;signals&quot;,&quot;to&quot;:&quot;first&quot;,&quot;label&quot;:&quot;逐项对照 SLO&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;first&quot;,&quot;to&quot;:&quot;capacity&quot;,&quot;label&quot;:&quot;取失败前稳定档&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;signals&quot;,&quot;to&quot;:&quot;hypothesis&quot;,&quot;label&quot;:&quot;支持与反证&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;hypothesis&quot;,&quot;to&quot;:&quot;rerun&quot;,&quot;label&quot;:&quot;只改一个变量&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;rerun&quot;,&quot;to&quot;:&quot;steps&quot;,&quot;label&quot;:&quot;同负载复验&quot;,&quot;kind&quot;:&quot;feedback&quot;}]}</metadata>
