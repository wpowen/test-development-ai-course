<text x="64" y="53" font-size="18" fill="#215cbb" font-weight="750" class="mono">QUALITY ENGINEERING  /  TD-AP05</text>
<text x="64" y="112" font-size="40" fill="#172b45" font-weight="750" >容量取首个失败前的稳定台阶</text>
<text x="64" y="170" font-size="24" fill="#50647c" font-weight="450" >固定 workload 与 SLO，阶梯加压找首个失败门禁，再用单变量复跑确认瓶颈。</text>
