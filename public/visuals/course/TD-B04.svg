<text x="88" y="1923" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1968" font-size="23" fill="#ffdce2" font-weight="450" >模型与 harness 同时变化、样本未锁定或缺逐题配对时标注混杂，不归因给单一变量。</text>
