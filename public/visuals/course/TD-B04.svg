<title id="title">锁定模型数据测协议敏感度</title><desc id="desc">每轮只扰动一个协议变量，同题配对比较先量噪声底线，再做有限归因。 A 与 B 是并列对照条件，不是两个先后执行的业务步骤 协议扰动可显示变量影响，不能单独解释机制；没有实测前不填波动幅度或模型名次。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-B04 / 五个扰动变量怎么测、往哪个方向偏;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-B04 / 架构节点与交付物;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-B04 / 先量出协议敏感度，再谈模型差异">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-B04&quot;,&quot;pageIds&quot;:[&quot;TD-B04&quot;],&quot;primaryPageIds&quot;:[&quot;TD-B04&quot;],&quot;layout&quot;:&quot;metric&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-B04 / 五个扰动变量怎么测、往哪个方向偏&quot;,&quot;quote&quot;:&quot;每一行都是一次「固定模型、只改这一项」的实验。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-B04 / 架构节点与交付物&quot;,&quot;quote&quot;:&quot;单变量实验能告诉你哪个变量有影响，不能告诉你为什么&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-B04 / 先量出协议敏感度，再谈模型差异&quot;,&quot;quote&quot;:&quot;harness 升级后必须重建基线，不能与旧分数直接连成曲线。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;data&quot;,&quot;title&quot;:&quot;Locked Dataset&quot;},{&quot;id&quot;:&quot;model&quot;,&quot;title&quot;:&quot;Locked Model&quot;},{&quot;id&quot;:&quot;a&quot;,&quot;title&quot;:&quot;Protocol Variant A&quot;},{&quot;id&quot;:&quot;b&quot;,&quot;title&quot;:&quot;Protocol Variant B&quot;},{&quot;id&quot;:&quot;runner&quot;,&quot;title&quot;:&quot;Harness/Tools&quot;},{&quot;id&quot;:&quot;raw&quot;,&quot;title&quot;:&quot;Raw Runs&quot;},{&quot;id&quot;:&quot;paired&quot;,&quot;title&quot;:&quot;Paired Comparison&quot;},{&quot;id&quot;:&quot;attribution&quot;,&quot;title&quot;:&quot;有限归因&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;data&quot;,&quot;to&quot;:&quot;runner&quot;,&quot;label&quot;:&quot;锁定样本&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;model&quot;,&quot;to&quot;:&quot;runner&quot;,&quot;label&quot;:&quot;锁定模型&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;a&quot;,&quot;to&quot;:&quot;runner&quot;,&quot;label&quot;:&quot;基准条件&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;b&quot;,&quot;to&quot;:&quot;runner&quot;,&quot;label&quot;:&quot;单变量对照&quot;,&quot;kind&quot;:&quot;control&quot;},{&quot;from&quot;:&quot;runner&quot;,&quot;to&quot;:&quot;raw&quot;,&quot;label&quot;:&quot;分别保存 A/B 结果&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;raw&quot;,&quot;to&quot;:&quot;paired&quot;,&quot;label&quot;:&quot;按 case 配对&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;paired&quot;,&quot;to&quot;:&quot;attribution&quot;,&quot;label&quot;:&quot;差值与噪声证据&quot;,&quot;kind&quot;:&quot;evidence&quot;}]}</metadata>
