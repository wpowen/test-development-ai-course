<title id="title">失败证据、聚类假设与因果结论分层</title><desc id="desc">原始失败只追加；相似聚类先成为假设，控制实验与 Owner 复核后才能升级根因。 证据层不可被摘要覆盖，缺 Trace 或混合版本显式进入 UNKNOWN 合成 Trace 门禁不证明真实遥测、AI 聚类准确率或生产 RCA。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-2.json#TD-T08 / 架构节点与交付物;docs/svg-redesign-2026-10-26/body-sources/course-2.json#TD-T08 / 证据如何流转与停止">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-T08&quot;,&quot;pageIds&quot;:[&quot;TD-T08&quot;],&quot;primaryPageIds&quot;:[&quot;TD-T08&quot;],&quot;layout&quot;:&quot;layers&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-2.json&quot;,&quot;locator&quot;:&quot;TD-T08 / 架构节点与交付物&quot;,&quot;quote&quot;:&quot;任何把结论写回证据层的动作都会破坏这个结构&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-2.json&quot;,&quot;locator&quot;:&quot;TD-T08 / 证据如何流转与停止&quot;,&quot;quote&quot;:&quot;trace 缺失、采样洞或版本混合时 cause gate 锁定 UNKNOWN。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;raw&quot;,&quot;title&quot;:&quot;只追加原始事件&quot;},{&quot;id&quot;:&quot;view&quot;,&quot;title&quot;:&quot;Trace 与版本只读视图&quot;},{&quot;id&quot;:&quot;cluster&quot;,&quot;title&quot;:&quot;候选 Failure Cluster&quot;},{&quot;id&quot;:&quot;hypothesis&quot;,&quot;title&quot;:&quot;诊断 Hypothesis&quot;},{&quot;id&quot;:&quot;experiment&quot;,&quot;title&quot;:&quot;控制变量实验&quot;},{&quot;id&quot;:&quot;gate&quot;,&quot;title&quot;:&quot;Cause Gate&quot;},{&quot;id&quot;:&quot;unknown&quot;,&quot;title&quot;:&quot;UNKNOWN&quot;},{&quot;id&quot;:&quot;replay&quot;,&quot;title&quot;:&quot;修复与原样回放&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;raw&quot;,&quot;to&quot;:&quot;view&quot;,&quot;label&quot;:&quot;只读引用&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;view&quot;,&quot;to&quot;:&quot;cluster&quot;,&quot;label&quot;:&quot;标准字段&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;cluster&quot;,&quot;to&