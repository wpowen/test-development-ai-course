<text x="64" y="53" font-size="18" fill="#215cbb" font-weight="750" class="mono">QUALITY ENGINEERING  /  TD-B03</text>
<text x="64" y="112" font-size="40" fill="#172b45" font-weight="750" >原始逐题账本分流判分再聚合</text>
<text x="64" y="170" font-size="24" fill="#50647c" font-weight="450" >至少一次成功与连续全部成功是不同问题；分母、重复结构和 Oracle 必须可回查。</text>
