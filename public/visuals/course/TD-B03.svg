<title id="title">原始逐题账本分流判分再聚合</title><desc id="desc">至少一次成功与连续全部成功是不同问题；分母、重复结构和 Oracle 必须可回查。 确定性判据与经校准 Judge 分流，保留各自不确定性 本图定义指标而不报告测量值；Judge 不确定性不能靠更多重复或通用校准阈值消除。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-B03 / 架构节点与交付物;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-B03 / 指标的分母决定了它在回答什么;docs/svg-redesign-2026-10-26/body-sources/course-3.json#TD-B03 / 完成标准与停止条件">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-B03&quot;,&quot;pageIds&quot;:[&quot;TD-B03&quot;],&quot;primaryPageIds&quot;:[&quot;TD-B03&quot;],&quot;layout&quot;:&quot;metric&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-B03 / 架构节点与交付物&quot;,&quot;quote&quot;:&quot;先落原始记录，再分流到确定性 Oracle 与 Judge 两条判分路径，最后才聚合。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-B03 / 指标的分母决定了它在回答什么&quot;,&quot;quote&quot;:&quot;pass@k 的分母是任务数、分子是「k 次尝试中至少成功一次」；pass^k 的分子是「k 次全部成功」。&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-3.json&quot;,&quot;locator&quot;:&quot;TD-B03 / 完成标准与停止条件&quot;,&quot;quote&quot;:&quot;同任务多次重复须做聚类修正，不得把采样次数当成独立 n&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;runs&quot;,&quot;title&quot;:&quot;逐题多次 Runs&quot;},{&quot;id&quot;:&quot;raw&quot;,&quot;title&quot;:&quot;Raw Ledger&quot;},{&quot;id&quot;:&quot;deterministic&quot;,&quot;title&quot;:&quot;确定性 Oracle&quot;},{&quot;id&quot;:&quot;judge&quot;,&quot;title&quot;:&quot;Judge/校准&quot;},{&quot;id&quot;:&quot;calculator&quot;,&quot;title&quot;:&quot;Metric Calculator&quot;},{&quot;id&quot;:&quot;uncertainty&quot;,&quot;title&quot;:&quot;Slice/Confidence&quot;},{&quot;id&quot;:&quot;gate&quot;,&quot;title&quot;:&quot;Decision Gate&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;runs&quot;,&quot;to&quot;:&quot;raw&quot;,&quot;label&quot;:&quot;每题每次落账&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;raw&quot;,&quot;to&quot;:&quot;deterministic&quot;,&quot;label&quot;:&quot;可断言输出&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;raw&quot;,&quot;to&quot;:&quot;judge&quot;,&quot;label&quot;:&quot;开放式输出&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;deterministic&quot;,&quot;to&quot;:&quot;calculator&quot;,&quot;label&quot;:&quot;确定性结果分栏&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;judge&quot;,&quot;to&quot;:&quot;calculator&quot;,&quot;label&quot;:&quot;Judge 结果分栏&quot;,&quot;kind&quot;:&quot;evidence&quot;},{&quot;from&quot;:&quot;calculator&quot;,&quot;to&quot;:&quot;uncertainty&quot;,&quot;label&quot;:&quot;分母与逐题结果&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;uncertainty&quot;,&quot;to&quot;:&quot;gate&quot;,&quot;label&quot;:&quot;切片区间&quot;,&quot;kind&quot;:&quot;control&quot;}]}</metadata>
