<title id="title">按失败机制选择最小充分证据</title><desc id="desc">同一取消业务的三类风险需要不同方法；选择依据是可检出的失败与独立 Oracle。 已发货退款、重复退款、错误码变更的并列方法选择 图中没有通用风险分数或检测成本；阈值与资源预算须由目标团队确认。</desc><metadata data-source-ref="docs/svg-redesign-2026-10-26/body-sources/course-1.json#TD-P04 / P04 工作示例：从损失倒推测试层级;docs/svg-redesign-2026-10-26/body-sources/course-1.json#TD-P04 / 策略门禁看覆盖关系，不看用例数量">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-P04&quot;,&quot;pageIds&quot;:[&quot;TD-P04&quot;],&quot;primaryPageIds&quot;:[&quot;TD-P04&quot;],&quot;layout&quot;:&quot;comparison&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-1.json&quot;,&quot;locator&quot;:&quot;TD-P04 / P04 工作示例：从损失倒推测试层级&quot;,&quot;quote&quot;:&quot;重复点击造成两次退款是幂等错误&quot;},{&quot;path&quot;:&quot;docs/svg-redesign-2026-10-26/body-sources/course-1.json&quot;,&quot;locator&quot;:&quot;TD-P04 / 策略门禁看覆盖关系，不看用例数量&quot;,&quot;quote&quot;:&quot;用例数量本身不是质量信号&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;stateRisk&quot;,&quot;title&quot;:&quot;已发货仍退款&quot;},{&quot;id&quot;:&quot;repeatRisk&quot;,&quot;title&quot;:&quot;重复点击退款&quot;},{&quot;id&quot;:&quot;schemaRisk&quot;,&quot;title&quot;:&quot;错误码字段变更&quot;},{&quot;id&quot;:&quot;stateTest&quot;,&quot;title&quot;:&quot;状态与集成验证&quot;},{&quot;id&quot;:&quot;repeatTest&quot;,&quot;title&quot;:&quot;属性与消息重放&quot;},{&quot;id&quot;:&quot;schemaTest&quot;,&quot;title&quot;:&quot;契约验证&quot;},{&quot;id&quot;:&quot;decision&quot;,&quot;title&quot;:&quot;资源取舍记录&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;stateRisk&quot;,&quot;to&quot;:&quot;stateTest&quot;,&quot;label&quot;:&quot;状态/资金失败&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;repeatRisk&quot;,&quot;to&quot;:&quot;repeatTest&quot;,&quot;label&quot;:&quot;幂等失败&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;schemaRisk&quot;,&quot;to&quot;:&quot;schemaTest&quot;,&quot;label&quot;:&quot;契约失败&quot;,&quot;kind&quo