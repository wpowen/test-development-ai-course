<text x="64" y="1964.215809284818" font-size="20" fill="#50647c" font-weight="450" >不覆盖 AI 系统特有的失败形态，那从 TD-M01 开始；不覆盖具体专项的测试手法（接口、UI、性能），那在 TD-M08；工件格式给的是最小必要字段，</text>
<text x="64" y="1995.215809284818" font-size="20" fill="#50647c" font-weight="450" >不是某一家工具链的规范。教学路线不证明真实模型或生产效果，未执行环节保持 NOT_RUN。</text>
