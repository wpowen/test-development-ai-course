<title id="title">完整测试生命周期｜模块全景</title><desc id="desc">需求到发布是一条链，每一站交出一个下游程序能直接消费的工件。 本模块学习路径 · 箭头表示学习先后与交付承接 不覆盖 AI 系统特有的失败形态，那从 TD-M01 开始；不覆盖具体专项的测试手法（接口、UI、性能），那在 TD-M08；工件格式给的是最小必要字段，不是某一家工具链的规范。教学路线不证明真实模型或生产效果，未执行环节保持 NOT_RUN。</desc><metadata data-source-ref="content/module-overviews.ts#TD-M00 / stages + logic + boundary">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-M00&quot;,&quot;pageIds&quot;:[&quot;TD-F01&quot;,&quot;TD-P01&quot;,&quot;TD-P02&quot;,&quot;TD-P03&quot;,&quot;TD-P04&quot;,&quot;TD-P05&quot;,&quot;TD-P06&quot;,&quot;TD-P07&quot;,&quot;TD-P08&quot;],&quot;primaryPageIds&quot;:[],&quot;layout&quot;:&quot;flow&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;content/module-overviews.ts&quot;,&quot;locator&quot;:&quot;TD-M00 / stages + logic + boundary&quot;,&quot;quote&quot;:&quot;需求到发布是一条链，每一站交出一个下游程序能直接消费的工件。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;title&quot;:&quot;定位职责&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;title&quot;:&quot;冻结依据&quot;},{&quot;id&quot;:&quot;s3&quot;,&quot;title&quot;:&quot;建立契约&quot;},{&quot;id&quot;:&quot;s4&quot;,&quot;title&quot;:&quot;定测试策略&quot;},{&quot;id&quot;:&quot;s5&quot;,&quot;title&quot;:&quot;固定判据&quot;},{&quot;id&quot;:&quot;s6&quot;,&quot;title&quot;:&quot;接入自动化&quot;},{&quot;id&quot;:&quot;s7&quot;,&quot;title&quot;:&quot;执行与归因&quot;},{&quot;id&quot;:&quot;s8&quot;,&quot;title&quot;:&quot;发布判断&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;s1&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s2&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s3&quot;,&quot;to&quot;:&quot;s4&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s4&quot;,&quot;to&quot;:&quot;s5&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;