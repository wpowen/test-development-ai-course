<g id="failure-and-output" data-region="64,1459.3387703889584,1472,183">
<rect x="64" y="1459.3387703889584" width="1472" height="183" rx="14" fill="#172e4c" stroke="none" />
<text x="88" y="1498.3387703889584" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1543.3387703889584" font-size="23" fill="#ffdce2" font-weight="450" >阶段所需输入、判据或证据缺失时，先返回相应课页补齐；不能把练习执行成功直接当作生产能力证明。</text>
<text x="88" y="1586.3387703889584" font-size="23" fill="#dce9fa" font-weight="450" >带走物：一句话立场：不能只测最终答案；被测边界勾选与七日起步节奏；一条分层判定；门禁默认 L1+L5+L7；一条失败轨</text>
<text x="88" y="1621.3387703889584" font-size="23" fill="#dce9fa" font-weight="450" >迹上的首错标注；最小门禁清单与下一步分叉。</text>
</g>
<text x="64" y="1690.3387703889584" font-size="20" fill="#50647c" font-weight="450" >不覆盖 D0–D7 架构分域与交易适配器，那在 TD-M12；不把夹具通过写成 live 或生产可发；不包含 TD-AI-00、TD-AI-06、TD-AI-07。教学路线不</text>
<text x="64" y="1721.3387703889584" font-size="20" fill="#50647c" font-weight="450" >证明真实模型或生产效果，未执行环节保持 NOT_RUN。</text>
<text x="64" y="1760.3387703889584" font-size="18" fill="#50647c" font-weight="450" >对应课程：TD-AI-01 / TD-AI-02 / TD-AI-03 / TD-AI-04 / TD-AI-05 · 补充研究与待验证主题｜模块全景</text>
