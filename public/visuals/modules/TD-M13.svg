<rect x="1086" y="1240.3387703889584" width="7" height="30" rx="3" fill="#945c0b" stroke="none" />
<text x="1108" y="1265.3387703889584" font-size="25" fill="#945c0b" font-weight="700" >如何判断学会了</text>
<text x="1090" y="1320.3387703889584" font-size="23" fill="#172b45" font-weight="450" >本模块的出口是一张最小门禁清单和</text>
<text x="1090" y="1355.3387703889584" font-size="23" fill="#172b45" font-weight="450" >一条下一步分叉，不是生产可发结论，</text>
<text x="1090" y="1390.3387703889584" font-size="23" fill="#172b45" font-weight="450" >也不是 D0–D7 架构专章。</text>
