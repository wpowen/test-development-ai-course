<rect x="585" y="1240.3387703889584" width="7" height="30" rx="3" fill="#7045a4" stroke="none" />
<text x="607" y="1265.3387703889584" font-size="25" fill="#7045a4" font-weight="700" >怎样承接下一步</text>
<text x="589" y="1320.3387703889584" font-size="23" fill="#172b45" font-weight="450" >五段按阅读顺序固定为：为何测</text>
<text x="589" y="1355.3387703889584" font-size="23" fill="#172b45" font-weight="450" >Agent、前 7 天开测、指标分层、怎</text>
<text x="589" y="1390.3387703889584" font-size="23" fill="#172b45" font-weight="450" >样发现问题、迁移与验收。</text>
