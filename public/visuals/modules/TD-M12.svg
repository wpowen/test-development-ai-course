<title id="title">Agent 测试架构｜模块全景</title><desc id="desc">Agent 的验证面有八个域，任何一个域缺证据都不构成可发布。 本模块学习路径 · 箭头表示学习先后与交付承接 不覆盖 Agent 框架的选型与实现；高风险适配器以交易/金融为例，其他行业需自行映射；全部门禁基于夹具运行，未接入真实交易系统。教学路线不证明真实模型或生产效果，未执行环节保持 NOT_RUN。</desc><metadata data-source-ref="content/module-overviews.ts#TD-M12 / stages + logic + boundary">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-M12&quot;,&quot;pageIds&quot;:[&quot;TD-AG-00&quot;,&quot;TD-AG-01&quot;,&quot;TD-AG-02&quot;,&quot;TD-AG-03&quot;,&quot;TD-AG-04&quot;,&quot;TD-AG-05&quot;,&quot;TD-AG-06&quot;,&quot;TD-AG-07&quot;,&quot;TD-AG-08&quot;,&quot;TD-AG-09&quot;,&quot;TD-AG-10&quot;],&quot;primaryPageIds&quot;:[],&quot;layout&quot;:&quot;flow&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;content/module-overviews.ts&quot;,&quot;locator&quot;:&quot;TD-M12 / stages + logic + boundary&quot;,&quot;quote&quot;:&quot;Agent 的验证面有八个域，任何一个域缺证据都不构成可发布。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;title&quot;:&quot;架构总览&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;title&quot;:&quot;D0 评判可信&quot;},{&quot;id&quot;:&quot;s3&quot;,&quot;title&quot;:&quot;D1–D2 轨迹与编排&quot;},{&quot;id&quot;:&quot;s4&quot;,&quot;title&quot;:&quot;D3–D4 人机与可靠性&quot;},{&quot;id&quot;:&quot;s5&quot;,&quot;title&quot;:&quot;D5 持续安全&quot;},{&quot;id&quot;:&quot;s6&quot;,&quot;title&quot;:&quot;D6–D7 经济与治理&quot;},{&quot;id&quot;:&quot;s7&quot;,&quot;title&quot;:&quot;收拢为发布决定&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;s1&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s2&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s3&quot;,&quot;to&quot;:&quot;s4&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s4&quot;,&quot;to&quot;:&quot;s5&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot