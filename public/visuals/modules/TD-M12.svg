<text x="64" y="1462.215809284818" font-size="21" fill="#215cbb" font-weight="800" class="mono">B</text>
<text x="98" y="1462.215809284818" font-size="27" fill="#172b45" font-weight="700" >把图中的关系落到可执行检查</text>
<g id="detail-0" data-region="64,1492.215809284818,470,314">
<rect x="64" y="1492.215809284818" width="470" height="314" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="84" y="1514.215809284818" width="7" height="30" rx="3" fill="#215cbb" stroke="none" />
<text x="106" y="1539.215809284818" font-size="25" fill="#215cbb" font-weight="700" >为什么先学这一步</text>
<text x="88" y="1594.215809284818" font-size="23" fill="#172b45" font-weight="450" >Agent 系统的失败面比传统系统宽得</text>
<text x="88" y="1629.215809284818" font-size="23" fill="#172b45" font-weight="450" >多：评判本身可能不可信、轨迹里某一</text>
<text x="88" y="1664.215809284818" font-size="23" fill="#172b45" font-weight="450" >步错了、多 Agent 交接时状态丢了、</text>
<text x="88" y="1699.215809284818" font-size="23" fill="#172b45" font-weight="450" >人接管的时机太晚、成功率随任务时长</text>
<text x="88" y="1734.215809284818" font-size="23" fill="#172b45" font-weight="450" >衰减、被注入指令后越权、成本随重试</text>
<text x="88" y="1769.215809284818" font-size="23" fill="#172b45" font-weight="450" >爆炸、业务规则没有审计记录。</text>
</g>
<g id="detail-1" data-region="565,1492.215809284818,470,314">
<rect x="565" y="1492.215809284818" width="470" height="314" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="585" y="1514.215809284818" width="7" height="30" rx="3" fill="#7045a4" stroke="none" />
<text x="607" y="1539.215809284818" font-size="25" fill="#7045a4" font-weight="700" >怎样承接下一步</text>
<text x="589" y="1594.215809284818" font-size="23" fill="#172b45" font-weight="450" >D0 排在最前面是有原因的：如果评判</text>
<text x="589" y="1629.215809284818" font-size="23" fill="#172b45" font-weight="450" >标准本身不可信，后面七个域的所有</text>
<text x="589" y="1664.215809284818" font-size="23" fill="#172b45" font-weight="450" >结论都不成立。</text>
</g>
<g id="detail-2" data-region="1066,1492.215809284818,470,314">
<rect x="1066" y="1492.215809284818" width="470" height="314" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="1086" y="1514.215809284818" width="7" height="30" rx="3" fill="#945c0b" stroke="none" />
<text x="1108" y="1539.215809284818" font-size="25" fill="#945c0b" font-weight="700" >如何判断学会了</text>
<text x="1090" y="1594.215809284818" font-size="23" fill="#172b45" font-weight="450" >四证据环把八个域的产出收拢成发布决</text>
<text x="1090" y="1629.215809284818" font-size="23" fill="#172b45" font-weight="450" >定：能力环证明它能做对、可靠性环证</text>
<text x="1090" y="1664.215809284818" font-size="23" fill="#172b45" font-weight="450" >明它稳定地做对、安全环证明它不会做</text>
<text x="1090" y="1699.215809284818" font-size="23" fill="#172b45" font-weight="450" >不该做的、经济环证明这件事划算。</text>
</g>
<g id="failure-and-output" data-region="64,1838.215809284818,1472,183">
<rect x="64" y="1838.215809284818" width="1472" height="183" rx="14" fill="#172e4c" stroke="none" />
<text x="88" y="1877.215809284818" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1922.215809284818" font-size="23" fill="#ffdce2" font-weight="450" >阶段所需输入、判据或证据缺失时，先返回相应课页补齐；不能把练习执行成功直接当作生产能力证明。</text>
<text x="88" y="1965.215809284818" font-size="23" fill="#dce9fa" font-weight="450" >带走物：D0–D7 架构图与边界登记册；Judge Card 与金标集；轨迹 ledger 与 handoff 契约；接管 Trace 与 pass^k 曲线；</text>
<text x="88" y="2000.215809284818" font-size="23" fill="#dce9fa" font-weight="450" >安全套件与红队报告；成本卡与 lineage 卡；四证据环与三段门禁。</text>
</g>
<text x="64" y="2069.215809284818" font-size="20" fill="#50647c" font-weight="450" >不覆盖 Agent 框架的选型与实现；高风险适配器以交易/金融为例，其他行业需自行映射；全部门禁基于夹具运行，未接入真实交易系统。教学路线不</text>
<text x="64" y="2100.215809284818" font-size="20" fill="#50647c" font-weight="450" >证明真实模型或生产效果，未执行环节保持 NOT_RUN。</text>
