<text x="88" y="1627.3299874529484" font-size="23" fill="#dce9fa" font-weight="450" >带走物：七段流水线与审计清单；Dataset Card 与 Holdout 合同；Metric Card 与逐题 ledger；单变量敏感性报告；污染</text>
<text x="88" y="1662.3299874529484" font-size="23" fill="#dce9fa" font-weight="450" >与版本审计报告；内部 Benchmark 仓库与治理卡。</text>
