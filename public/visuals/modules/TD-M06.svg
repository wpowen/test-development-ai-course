<text x="64" y="1731.3299874529484" font-size="20" fill="#50647c" font-weight="450" >不覆盖模型训练与预训练数据构建；不对任何公开榜单的具体分数做评价；污染检测用的是可复现的重叠度方法，不是训练数据审计。教学路线不证明</text>
