<text x="106" y="1236.3299874529484" font-size="25" fill="#215cbb" font-weight="700" >为什么先学这一步</text>
<text x="88" y="1291.3299874529484" font-size="23" fill="#172b45" font-weight="450" >同一个模型在同一个 Benchmark 上，</text>
<text x="88" y="1326.3299874529484" font-size="23" fill="#172b45" font-weight="450" >不同团队跑出来的分数可以差好几个</text>
<text x="88" y="1361.3299874529484" font-size="23" fill="#172b45" font-weight="450" >点，而且双方都没有作弊。</text>
