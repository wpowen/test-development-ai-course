<g id="detail-1" data-region="565,1189.3299874529484,470,279">
<rect x="565" y="1189.3299874529484" width="470" height="279" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="585" y="1211.3299874529484" width="7" height="30" rx="3" fill="#7045a4" stroke="none" />
<text x="607" y="1236.3299874529484" font-size="25" fill="#7045a4" font-weight="700" >怎样承接下一步</text>
<text x="589" y="1291.3299874529484" font-size="23" fill="#172b45" font-weight="450" >这个模块的作用是让你在看到一个分数</text>
<text x="589" y="1326.3299874529484" font-size="23" fill="#172b45" font-weight="450" >时能问出正确的问题：这是 pass@1</text>
<text x="589" y="1361.3299874529484" font-size="23" fill="#172b45" font-weight="450" >还是 pass@10、holdout 有没有被模</text>
<text x="589" y="1396.3299874529484" font-size="23" fill="#172b45" font-weight="450" >型见过、置信区间多宽、评分器是精</text>
<text x="589" y="1431.3299874529484" font-size="23" fill="#172b45" font-weight="450" >确匹配还是模型判分。</text>
</g>
