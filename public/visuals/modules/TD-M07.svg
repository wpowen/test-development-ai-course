<g id="detail-0" data-region="64,1189.3299874529484,470,279">
<rect x="64" y="1189.3299874529484" width="470" height="279" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="84" y="1211.3299874529484" width="7" height="30" rx="3" fill="#215cbb" stroke="none" />
<text x="106" y="1236.3299874529484" font-size="25" fill="#215cbb" font-weight="700" >为什么先学这一步</text>
<text x="88" y="1291.3299874529484" font-size="23" fill="#172b45" font-weight="450" >前面每个模块交付的都是单点工件—</text>
<text x="88" y="1326.3299874529484" font-size="23" fill="#172b45" font-weight="450" >—一份契约、一个评测集、一份运行</text>
<text x="88" y="1361.3299874529484" font-size="23" fill="#172b45" font-weight="450" >收据。</text>
</g>
<g id="detail-1" data-region="565,1189.3299874529484,470,279">
<rect x="565" y="1189.3299874529484" width="470" height="279" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="585" y="1211.3299874529484" width="7" height="30" rx="3" fill="#7045a4" stroke="none" />
<text x="607" y="1236.3299874529484" font-size="25" fill="#7045a4" font-weight="700" >怎样承接下一步</text>
<text x="589" y="1291.3299874529484" font-size="23" fill="#172b45" font-weight="450" >接进真实系统会暴露一类在单点演示</text>
<text x="589" y="1326.3299874529484" font-size="23" fill="#172b45" font-weight="450" >里看不到的问题：事件重复投递导致</text>
<text x="589" y="1361.3299874529484" font-size="23" fill="#172b45" font-weight="450" >重复执行、异步回写晚于发布判断、</text>
<text x="589" y="1396.3299874529484" font-size="23" fill="#172b45" font-weight="450" >临时环境没回收导致数据串号、通知</text>
<text x="589" y="1431.3299874529484" font-size="23" fill="#172b45" font-weight="450" >里带出了敏感字段。</text>
</g>
<g id="detail-2" data-region="1066,1189.3299874529484,470,279">
<rect x="1066" y="1189.3299874529484" width="470" height="279" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="1086" y="1211.3299874529484" width="7" height="30" rx="3" fill="#945c0b" stroke="none" />
<text x="1108" y="1236.3299874529484" font-size="25" fill="#945c0b" font-weight="700" >如何判断学会了</text>
<text x="1090" y="1291.3299874529484" font-size="23" fill="#172b45" font-weight="450" >Capstone 是一次完整的交付演练：从</text>
<text x="1090" y="1326.3299874529484" font-size="23" fill="#172b45" font-weight="450" >需求进来到发布候选出去，中间每一步</text>
<text x="1090" y="1361.3299874529484" font-size="23" fill="#172b45" font-weight="450" >的产物都可追溯，最后能回答「这个版</text>
<text x="1090" y="1396.3299874529484" font-size="23" fill="#172b45" font-weight="450" >本凭什么可以发」这个问题，并且答案</text>
<text x="1090" y="1431.3299874529484" font-size="23" fill="#172b45" font-weight="450" >是一条链而不是一句话。</text>
</g>
<g id="failure-and-output" data-region="64,1500.3299874529484,1472,183">
<rect x="64" y="1500.3299874529484" width="1472" height="183" rx="14" fill="#172e4c" stroke="none" />
<text x="88" y="1539.3299874529484" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1584.3299874529484" font-size="23" fill="#ffdce2" font-weight="450" >阶段所需输入、判据或证据缺失时，先返回相应课页补齐；不能把练习执行成功直接当作生产能力证明。</text>
<text x="88" y="1627.3299874529484" font-size="23" fill="#dce9fa" font-weight="450" >带走物：requirement event 与 Basis Gate 报告；MR 门禁 Manifest 与 SHA status；Ephemeral Environment Manifest；</text>
<text x="88" y="1662.3299874529484" font-size="23" fill="#dce9fa" font-weight="450" >事件包与 Inbox/Outbox/DLQ 记录；Fixture Release Candidate。</text>
</g>
<text x="64" y="1731.3299874529484" font-size="20" fill="#50647c" font-weight="450" >不覆盖 Jira / GitLab / K8s 的运维与安装；所有集成基于夹具与本地模拟，未接入生产实例；Capstone 产出的是 Release Candidate，不是已发布版</text>
<text x="64" y="1762.3299874529484" font-size="20" fill="#50647c" font-weight="450" >本。教学路线不证明真实模型或生产效果，未执行环节保持 NOT_RUN。</text>
