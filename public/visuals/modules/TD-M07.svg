<title id="title">专业专题与 Capstone｜模块全景</title><desc id="desc">把前面所有模块的工件接进真实工程系统，交出一条能审计的完整链路。 本模块学习路径 · 箭头表示学习先后与交付承接 不覆盖 Jira / GitLab / K8s 的运维与安装；所有集成基于夹具与本地模拟，未接入生产实例；Capstone 产出的是 Release Candidate，不是已发布版本。教学路线不证明真实模型或生产效果，未执行环节保持 NOT_RUN。</desc><metadata data-source-ref="content/module-overviews.ts#TD-M07 / stages + logic + boundary">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-M07&quot;,&quot;pageIds&quot;:[&quot;TD-QP01&quot;,&quot;TD-QP02&quot;,&quot;TD-QP03&quot;,&quot;TD-QP04&quot;,&quot;TD-T25&quot;],&quot;primaryPageIds&quot;:[],&quot;layout&quot;:&quot;flow&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;content/module-overviews.ts&quot;,&quot;locator&quot;:&quot;TD-M07 / stages + logic + boundary&quot;,&quot;quote&quot;:&quot;把前面所有模块的工件接进真实工程系统，交出一条能审计的完整链路。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;title&quot;:&quot;需求侧接入&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;title&quot;:&quot;代码侧门禁&quot;},{&quot;id&quot;:&quot;s3&quot;,&quot;title&quot;:&quot;环境隔离&quot;},{&quot;id&quot;:&quot;s4&quot;,&quot;title&quot;:&quot;跨系统事件&quot;},{&quot;id&quot;:&quot;s5&quot;,&quot;title&quot;:&quot;端到端交付&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;s1&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s2&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s3&quot;,&quot;to&quot;:&quot;s4&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s4&quot;,&quot;to&quot;:&quot;s5&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;}]}</metadata>
