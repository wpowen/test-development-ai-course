<g id="detail-0" data-region="64,1160.3212045169385,470,209">
<rect x="64" y="1160.3212045169385" width="470" height="209" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="84" y="1182.3212045169385" width="7" height="30" rx="3" fill="#215cbb" stroke="none" />
<text x="106" y="1207.3212045169385" font-size="25" fill="#215cbb" font-weight="700" >为什么先学这一步</text>
<text x="88" y="1262.3212045169385" font-size="23" fill="#172b45" font-weight="450" >让模型生成一百条用例是容易的，难</text>
<text x="88" y="1297.3212045169385" font-size="23" fill="#172b45" font-weight="450" >的是证明这一百条里有几条真的会在</text>
<text x="88" y="1332.3212045169385" font-size="23" fill="#172b45" font-weight="450" >代码坏掉的时候变红。</text>
</g>
<g id="detail-1" data-region="565,1160.3212045169385,470,209">
<rect x="565" y="1160.3212045169385" width="470" height="209" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="585" y="1182.3212045169385" width="7" height="30" rx="3" fill="#7045a4" stroke="none" />
<text x="607" y="1207.3212045169385" font-size="25" fill="#7045a4" font-weight="700" >怎样承接下一步</text>
<text x="589" y="1262.3212045169385" font-size="23" fill="#172b45" font-weight="450" >Mutation 是这里的判据来源：往被</text>
<text x="589" y="1297.3212045169385" font-size="23" fill="#172b45" font-weight="450" >测代码里注入已知缺陷，看这批用例</text>
<text x="589" y="1332.3212045169385" font-size="23" fill="#172b45" font-weight="450" >杀掉几个。</text>
</g>
<g id="detail-2" data-region="1066,1160.3212045169385,470,209">
<rect x="1066" y="1160.3212045169385" width="470" height="209" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="1086" y="1182.3212045169385" width="7" height="30" rx="3" fill="#945c0b" stroke="none" />
<text x="1108" y="1207.3212045169385" font-size="25" fill="#945c0b" font-weight="700" >如何判断学会了</text>
<text x="1090" y="1262.3212045169385" font-size="23" fill="#172b45" font-weight="450" >风险提取放在生成之前，因为无差别</text>
<text x="1090" y="1297.3212045169385" font-size="23" fill="#172b45" font-weight="450" >生成会把测试预算平均分配到所有代码</text>
<text x="1090" y="1332.3212045169385" font-size="23" fill="#172b45" font-weight="450" >上，而缺陷分布从来不是均匀的。</text>
</g>
<g id="failure-and-output" data-region="64,1401.3212045169385,1472,148">
<rect x="64" y="1401.3212045169385" width="1472" height="148" rx="14" fill="#172e4c" stroke="none" />
<text x="88" y="1440.3212045169385" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1485.3212045169385" font-size="23" fill="#ffdce2" font-weight="450" >阶段所需输入、判据或证据缺失时，先返回相应课页补齐；不能把练习执行成功直接当作生产能力证明。</text>
<text x="88" y="1528.3212045169385" font-size="23" fill="#dce9fa" font-weight="450" >带走物：带引用的风险候选包；候选包与 Mutation 处置报告；方法决策矩阵与最小反例；失败聚类与假设账本。</text>
</g>
<text x="64" y="1597.3212045169385" font-size="20" fill="#50647c" font-weight="450" >不覆盖 AI 系统本身的测试，这里 AI 是工具不是被测对象；不承诺提效数字，提效必须用 baseline 对照实验证明（见 TD-T26）；Mutation 用的是注入</text>
<text x="64" y="1628.3212045169385" font-size="20" fill="#50647c" font-weight="450" >夹具，不是生产代码库。教学路线不证明真实模型或生产效果，未执行环节保持 NOT_RUN。</text>
