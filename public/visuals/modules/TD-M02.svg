<title id="title">AI 帮你做传统测试｜模块全景</title><desc id="desc">AI 生成的测试要先证明它能发现缺陷，再谈提效。 本模块学习路径 · 箭头表示学习先后与交付承接 不覆盖 AI 系统本身的测试，这里 AI 是工具不是被测对象；不承诺提效数字，提效必须用 baseline 对照实验证明（见 TD-T26）；Mutation 用的是注入夹具，不是生产代码库。教学路线不证明真实模型或生产效果，未执行环节保持 NOT_RUN。</desc><metadata data-source-ref="content/module-overviews.ts#TD-M02 / stages + logic + boundary">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-M02&quot;,&quot;pageIds&quot;:[&quot;TD-T05&quot;,&quot;TD-T06&quot;,&quot;TD-T07&quot;,&quot;TD-T08&quot;],&quot;primaryPageIds&quot;:[],&quot;layout&quot;:&quot;flow&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;content/module-overviews.ts&quot;,&quot;locator&quot;:&quot;TD-M02 / stages + logic + boundary&quot;,&quot;quote&quot;:&quot;AI 生成的测试要先证明它能发现缺陷，再谈提效。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;title&quot;:&quot;提取变更风险&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;title&quot;:&quot;生成并验证检测力&quot;},{&quot;id&quot;:&quot;s3&quot;,&quot;title&quot;:&quot;选择测试方法&quot;},{&quot;id&quot;:&quot;s4&quot;,&quot;title&quot;:&quot;归类失败&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;s1&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s2&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s3&quot;,&quot;to&quot;:&quot;s4&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;}]}</metadata>
