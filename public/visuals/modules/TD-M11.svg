<title id="title">Agent 性能与稳定性工程｜模块全景</title><desc id="desc">Agent 的性能问题是多步累积的，单步指标看不出来。 本模块学习路径 · 箭头表示学习先后与交付承接 不覆盖模型推理引擎的内部优化；不覆盖 GPU 集群调度与资源编排；容量数据来自 synthetic 负载，未在生产流量下验证。教学路线不证明真实模型或生产效果，未执行环节保持 NOT_RUN。</desc><metadata data-source-ref="content/module-overviews.ts#TD-M11 / stages + logic + boundary">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-M11&quot;,&quot;pageIds&quot;:[&quot;TD-AP01&quot;,&quot;TD-AP02&quot;,&quot;TD-AP03&quot;,&quot;TD-AP04&quot;,&quot;TD-AP05&quot;,&quot;TD-AP06&quot;,&quot;TD-AP07&quot;,&quot;TD-AP08&quot;],&quot;primaryPageIds&quot;:[],&quot;layout&quot;:&quot;flow&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;content/module-overviews.ts&quot;,&quot;locator&quot;:&quot;TD-M11 / stages + logic + boundary&quot;,&quot;quote&quot;:&quot;Agent 的性能问题是多步累积的，单步指标看不出来。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;title&quot;:&quot;定义工作负载&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;title&quot;:&quot;建指标树&quot;},{&quot;id&quot;:&quot;s3&quot;,&quot;title&quot;:&quot;统一 Trace 语义&quot;},{&quot;id&quot;:&quot;s4&quot;,&quot;title&quot;:&quot;开闭环对照&quot;},{&quot;id&quot;:&quot;s5&quot;,&quot;title&quot;:&quot;容量与瓶颈&quot;},{&quot;id&quot;:&quot;s6&quot;,&quot;title&quot;:&quot;超时与降级&quot;},{&quot;id&quot;:&quot;s7&quot;,&quot;title&quot;:&quot;长稳与漂移&quot;},{&quot;id&quot;:&quot;s8&quot;,&quot;title&quot;:&quot;SLO 与事故&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;s1&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s2&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s3&quot;,&quot;to&quot;:&quot;s4&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s4&quot;,&quot;to&quot;:&quot;s5&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quo