<g id="detail-0" data-region="64,1521.224592220828,470,314">
<rect x="64" y="1521.224592220828" width="470" height="314" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="84" y="1543.224592220828" width="7" height="30" rx="3" fill="#215cbb" stroke="none" />
<text x="106" y="1568.224592220828" font-size="25" fill="#215cbb" font-weight="700" >为什么先学这一步</text>
<text x="88" y="1623.224592220828" font-size="23" fill="#172b45" font-weight="450" >一次 Agent 任务包含十几到几十次模</text>
<text x="88" y="1658.224592220828" font-size="23" fill="#172b45" font-weight="450" >型调用和工具调用，每一步的延迟单看</text>
<text x="88" y="1693.224592220828" font-size="23" fill="#172b45" font-weight="450" >都正常，加起来用户等了两分钟。</text>
</g>
<g id="detail-1" data-region="565,1521.224592220828,470,314">
<rect x="565" y="1521.224592220828" width="470" height="314" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="585" y="1543.224592220828" width="7" height="30" rx="3" fill="#7045a4" stroke="none" />
<text x="607" y="1568.224592220828" font-size="25" fill="#7045a4" font-weight="700" >怎样承接下一步</text>
<text x="589" y="1623.224592220828" font-size="23" fill="#172b45" font-weight="450" >Trace 语义是这个模块的地基。</text>
</g>
<g id="detail-2" data-region="1066,1521.224592220828,470,314">
<rect x="1066" y="1521.224592220828" width="470" height="314" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="1086" y="1543.224592220828" width="7" height="30" rx="3" fill="#945c0b" stroke="none" />
<text x="1108" y="1568.224592220828" font-size="25" fill="#945c0b" font-weight="700" >如何判断学会了</text>
<text x="1090" y="1623.224592220828" font-size="23" fill="#172b45" font-weight="450" >开闭环负载对照单独占一页，因为</text>
<text x="1090" y="1658.224592220828" font-size="23" fill="#172b45" font-weight="450" >Coordinated Omission 在 Agent 压</text>
<text x="1090" y="1693.224592220828" font-size="23" fill="#172b45" font-weight="450" >测里特别容易出现：客户端等上一个</text>
<text x="1090" y="1728.224592220828" font-size="23" fill="#172b45" font-weight="450" >任务结束才发下一个，系统慢下来时</text>
<text x="1090" y="1763.224592220828" font-size="23" fill="#172b45" font-weight="450" >压力自动减小，测出来的延迟分布比</text>
<text x="1090" y="1798.224592220828" font-size="23" fill="#172b45" font-weight="450" >真实情况乐观得多。</text>
</g>
<g id="failure-and-output" data-region="64,1867.224592220828,1472,183">
<rect x="64" y="1867.224592220828" width="1472" height="183" rx="14" fill="#172e4c" stroke="none" />
<text x="88" y="1906.224592220828" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1951.224592220828" font-size="23" fill="#ffdce2" font-weight="450" >阶段所需输入、判据或证据缺失时，先返回相应课页补齐；不能把练习执行成功直接当作生产能力证明。</text>
<text x="88" y="1994.224592220828" font-size="23" fill="#dce9fa" font-weight="450" >带走物：工作负载模型与 Oracle 证据卡；性能指标字典；Trace Schema 与字段治理表；开闭环对照报告；Synthetic 容量曲线</text>
