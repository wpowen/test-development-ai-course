<text x="607" y="1265.3387703889584" font-size="25" fill="#7045a4" font-weight="700" >怎样承接下一步</text>
<text x="589" y="1320.3387703889584" font-size="23" fill="#172b45" font-weight="450" >后半部分处理一个更根本的问题：概率</text>
<text x="589" y="1355.3387703889584" font-size="23" fill="#172b45" font-weight="450" >性系统里「通过」是什么意思。</text>
</g>
<g id="detail-2" data-region="1066,1218.3387703889584,470,244">
<rect x="1066" y="1218.3387703889584" width="470" height="244" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="1086" y="1240.3387703889584" width="7" height="30" rx="3" fill="#945c0b" stroke="none" />
<text x="1108" y="1265.3387703889584" font-size="25" fill="#945c0b" font-weight="700" >如何判断学会了</text>
<text x="1090" y="1320.3387703889584" font-size="23" fill="#172b45" font-weight="450" >Prompt Package 放在第一页，因为它</text>
<text x="1090" y="1355.3387703889584" font-size="23" fill="#172b45" font-weight="450" >是后面所有评测的最小单元。</text>
</g>
<g id="failure-and-output" data-region="64,1494.3387703889584,1472,183">
<rect x="64" y="1494.3387703889584" width="1472" height="183" rx="14" fill="#172e4c" stroke="none" />
<text x="88" y="1533.3387703889584" font-size="25" fill="#fff" font-weight="700" >C  故障后的动作与本页交付</text>
<text x="88" y="1578.3387703889584" font-size="23" fill="#ffdce2" font-weight="450" >阶段所需输入、判据或证据缺失时，先返回相应课页补齐；不能把练习执行成功直接当作生产能力证明。</text>
<text x="88" y="1621.3387703889584" font-size="23" fill="#dce9fa" font-weight="450" >带走物：Prompt Package 与运行收据；生命周期责任图与推理变量矩阵；结构与信任边界图；Eval Contract 与 dataset 卡；</text>
<text x="88" y="1656.3387703889584" font-size="23" fill="#dce9fa" font-weight="450" >风险—Oracle 决策表；重复运行报告与置信区间。</text>
</g>
<text x="64" y="1725.3387703889584" font-size="20" fill="#50647c" font-weight="450" >不覆盖模型训练与微调，那在 TD-M05；不覆盖 RAG 的检索与忠实度细节，那在 TD-M03；统计部分只到区间估计与重复运行，不展开实验设计理论。</text>
<text x="64" y="1756.3387703889584" font-size="20" fill="#50647c" font-weight="450" >教学路线不证明真实模型或生产效果，未执行环节保持 NOT_RUN。</text>
