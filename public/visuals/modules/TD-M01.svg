<g id="detail-0" data-region="64,1218.3387703889584,470,244">
<rect x="64" y="1218.3387703889584" width="470" height="244" rx="14" fill="#fff" stroke="#d9e2ed" />
<rect x="84" y="1240.3387703889584" width="7" height="30" rx="3" fill="#215cbb" stroke="none" />
<text x="106" y="1265.3387703889584" font-size="25" fill="#215cbb" font-weight="700" >为什么先学这一步</text>
<text x="88" y="1320.3387703889584" font-size="23" fill="#172b45" font-weight="450" >一个错误的回答可能来自六个完全不同</text>
<text x="88" y="1355.3387703889584" font-size="23" fill="#172b45" font-weight="450" >的地方：提示词写得有歧义、检索没召</text>
<text x="88" y="1390.3387703889584" font-size="23" fill="#172b45" font-weight="450" >回、上下文被截断、采样温度太高、模</text>
<text x="88" y="1425.3387703889584" font-size="23" fill="#172b45" font-weight="450" >型版本换了、或者判据本身就是错的。</text>
</g>
<g id="detail-1" data-region="565,1218.3387703889584,470,244">
