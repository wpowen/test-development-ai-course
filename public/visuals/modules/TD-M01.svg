<title id="title">大模型与 AI 系统基础｜模块全景</title><desc id="desc">先弄清模型在哪一层出错，再决定在哪一层测。 本模块学习路径 · 箭头表示学习先后与交付承接 不覆盖模型训练与微调，那在 TD-M05；不覆盖 RAG 的检索与忠实度细节，那在 TD-M03；统计部分只到区间估计与重复运行，不展开实验设计理论。教学路线不证明真实模型或生产效果，未执行环节保持 NOT_RUN。</desc><metadata data-source-ref="content/module-overviews.ts#TD-M01 / stages + logic + boundary">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-M01&quot;,&quot;pageIds&quot;:[&quot;TD-FP01&quot;,&quot;TD-F02&quot;,&quot;TD-F03&quot;,&quot;TD-F04&quot;,&quot;TD-T01&quot;,&quot;TD-T02&quot;,&quot;TD-T03&quot;,&quot;TD-T04&quot;],&quot;primaryPageIds&quot;:[],&quot;layout&quot;:&quot;flow&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;content/module-overviews.ts&quot;,&quot;locator&quot;:&quot;TD-M01 / stages + logic + boundary&quot;,&quot;quote&quot;:&quot;先弄清模型在哪一层出错，再决定在哪一层测。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;title&quot;:&quot;建立最小可验证单元&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;title&quot;:&quot;定位失败来源&quot;},{&quot;id&quot;:&quot;s3&quot;,&quot;title&quot;:&quot;划定被测边界&quot;},{&quot;id&quot;:&quot;s4&quot;,&quot;title&quot;:&quot;定义评测合同&quot;},{&quot;id&quot;:&quot;s5&quot;,&quot;title&quot;:&quot;组合判据&quot;},{&quot;id&quot;:&quot;s6&quot;,&quot;title&quot;:&quot;从单次到分布&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;s1&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s2&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s3&quot;,&quot;to&quot;:&quot;s4&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s4&quot;,&quot;to&quot;:&quot;s5&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s5&quot;,&quot;to&quot;:&quot;s6&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;}]}</metadata>
