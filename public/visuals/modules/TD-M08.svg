<title id="title">传统测试专项｜模块全景</title><desc id="desc">传统专项没有过时，过时的是它们原来的判据。 本模块学习路径 · 箭头表示学习先后与交付承接 不覆盖模型本身的质量评测，那在 TD-M03；不覆盖 Agent 轨迹与工具调用，那在 TD-M04；设备与浏览器矩阵给的是选择方法，不是某个具体的矩阵清单。教学路线不证明真实模型或生产效果，未执行环节保持 NOT_RUN。</desc><metadata data-source-ref="content/module-overviews.ts#TD-M08 / stages + logic + boundary">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-M08&quot;,&quot;pageIds&quot;:[&quot;TD-PS01&quot;,&quot;TD-PS02&quot;,&quot;TD-PS03&quot;,&quot;TD-PS04&quot;,&quot;TD-PS05&quot;,&quot;TD-PS06&quot;,&quot;TD-PS07&quot;,&quot;TD-PS08&quot;,&quot;TD-PS09&quot;,&quot;TD-PS10&quot;,&quot;TD-PS11&quot;,&quot;TD-PS12&quot;,&quot;TD-X101&quot;],&quot;primaryPageIds&quot;:[],&quot;layout&quot;:&quot;flow&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;content/module-overviews.ts&quot;,&quot;locator&quot;:&quot;TD-M08 / stages + logic + boundary&quot;,&quot;quote&quot;:&quot;传统专项没有过时，过时的是它们原来的判据。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;title&quot;:&quot;接口与契约&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;title&quot;:&quot;端到端界面&quot;},{&quot;id&quot;:&quot;s3&quot;,&quot;title&quot;:&quot;数据与迁移&quot;},{&quot;id&quot;:&quot;s4&quot;,&quot;title&quot;:&quot;性能与稳定性&quot;},{&quot;id&quot;:&quot;s5&quot;,&quot;title&quot;:&quot;线上可观测性&quot;},{&quot;id&quot;:&quot;s6&quot;,&quot;title&quot;:&quot;安全与供应链&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;s1&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s2&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s3&quot;,&quot;to&quot;:&quot;s4&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s4&quot;,&quot;to&quot;:&quot;s5&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s5&quot;,&quot;to&quot;:&q