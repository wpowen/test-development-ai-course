<text x="64" y="1725.3387703889584" font-size="20" fill="#50647c" font-weight="450" >不覆盖模型本身的质量评测，那在 TD-M03；不覆盖 Agent 轨迹与工具调用，那在 TD-M04；设备与浏览器矩阵给的是选择方法，不是某个具体的矩阵</text>
