<title id="title">AI 接口、性能与可靠性｜模块全景</title><desc id="desc">AI 接口的性能问题，一半出在协议状态机上，不在模型上。 本模块学习路径 · 箭头表示学习先后与交付承接 不覆盖 Agent 多步任务的性能，那在 TD-M11；不覆盖推理引擎内部实现，只到可观测的外部指标；容量结论绑定具体的模型版本与部署形态，换版本必须重测。教学路线不证明真实模型或生产效果，未执行环节保持 NOT_RUN。</desc><metadata data-source-ref="content/module-overviews.ts#TD-M09 / stages + logic + boundary">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-M09&quot;,&quot;pageIds&quot;:[&quot;TD-A01&quot;,&quot;TD-A02&quot;,&quot;TD-A03&quot;,&quot;TD-A04&quot;,&quot;TD-A05&quot;,&quot;TD-A06&quot;],&quot;primaryPageIds&quot;:[],&quot;layout&quot;:&quot;flow&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;content/module-overviews.ts&quot;,&quot;locator&quot;:&quot;TD-M09 / stages + logic + boundary&quot;,&quot;quote&quot;:&quot;AI 接口的性能问题，一半出在协议状态机上，不在模型上。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;title&quot;:&quot;识别被测面&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;title&quot;:&quot;协议状态机&quot;},{&quot;id&quot;:&quot;s3&quot;,&quot;title&quot;:&quot;统一指标口径&quot;},{&quot;id&quot;:&quot;s4&quot;,&quot;title&quot;:&quot;找容量拐点&quot;},{&quot;id&quot;:&quot;s5&quot;,&quot;title&quot;:&quot;瓶颈归因&quot;},{&quot;id&quot;:&quot;s6&quot;,&quot;title&quot;:&quot;验证韧性&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;s1&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s2&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s3&quot;,&quot;to&quot;:&quot;s4&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s4&quot;,&quot;to&quot;:&quot;s5&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s5&quot;,&quot;to&quot;:&quot;s6&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;}]}</metadata>
