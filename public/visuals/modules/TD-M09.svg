<text x="64" y="1597.3212045169385" font-size="20" fill="#50647c" font-weight="450" >不覆盖 Agent 多步任务的性能，那在 TD-M11；不覆盖推理引擎内部实现，只到可观测的外部指标；容量结论绑定具体的模型版本与部署形态，换版本</text>
