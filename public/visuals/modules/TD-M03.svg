<text x="88" y="1918.233375156838" font-size="23" fill="#dce9fa" font-weight="450" >带走物：corpus manifest 与准入报告；query set 与 miss 诊断；声明—证据矩阵与反例集；端到端 Gate 与权限攻击集；配</text>
