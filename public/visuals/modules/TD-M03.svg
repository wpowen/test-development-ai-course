<title id="title">测试 LLM 和 RAG｜模块全景</title><desc id="desc">RAG 的答案对不对，要拆成检索到了没有和有没有照着说两件事。 本模块学习路径 · 箭头表示学习先后与交付承接 不覆盖向量库的工程选型与运维；不覆盖 Agent 的多步检索编排，那在 TD-M04；忠实度判据依赖标注质量，标注协议本身在 TD-T03。教学路线不证明真实模型或生产效果，未执行环节保持 NOT_RUN。</desc><metadata data-source-ref="content/module-overviews.ts#TD-M03 / stages + logic + boundary">{&quot;version&quot;:&quot;2.0.0&quot;,&quot;id&quot;:&quot;TD-M03&quot;,&quot;pageIds&quot;:[&quot;TD-T09&quot;,&quot;TD-T10&quot;,&quot;TD-T11&quot;,&quot;TD-T12&quot;,&quot;TD-X501&quot;,&quot;TD-X502&quot;,&quot;TD-T13&quot;,&quot;TD-T14&quot;],&quot;primaryPageIds&quot;:[],&quot;layout&quot;:&quot;flow&quot;,&quot;sourceRefs&quot;:[{&quot;path&quot;:&quot;content/module-overviews.ts&quot;,&quot;locator&quot;:&quot;TD-M03 / stages + logic + boundary&quot;,&quot;quote&quot;:&quot;RAG 的答案对不对，要拆成检索到了没有和有没有照着说两件事。&quot;}],&quot;supplementalSources&quot;:[],&quot;nodes&quot;:[{&quot;id&quot;:&quot;s1&quot;,&quot;title&quot;:&quot;治理语料&quot;},{&quot;id&quot;:&quot;s2&quot;,&quot;title&quot;:&quot;评检索&quot;},{&quot;id&quot;:&quot;s3&quot;,&quot;title&quot;:&quot;评忠实度&quot;},{&quot;id&quot;:&quot;s4&quot;,&quot;title&quot;:&quot;端到端门禁&quot;},{&quot;id&quot;:&quot;s5&quot;,&quot;title&quot;:&quot;扩展模态与语言&quot;},{&quot;id&quot;:&quot;s6&quot;,&quot;title&quot;:&quot;版本对比&quot;},{&quot;id&quot;:&quot;s7&quot;,&quot;title&quot;:&quot;校准 Judge&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;s1&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s2&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s3&quot;,&quot;to&quot;:&quot;s4&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s4&quot;,&quot;to&quot;:&quot;s5&quot;,&quot;label&quot;:&quot;学习次序&quot;,&quot;kind&quot;:&quot;data&quot;},{&quot;from&quot;:&quot;s5&quot;,&quot;to&quot;:&quot;s6&quot;,&quot;label