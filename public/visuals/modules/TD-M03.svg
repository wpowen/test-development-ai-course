<text x="64" y="2022.233375156838" font-size="20" fill="#50647c" font-weight="450" >不覆盖向量库的工程选型与运维；不覆盖 Agent 的多步检索编排，那在 TD-M04；忠实度判据依赖标注质量，标注协议本身在 TD-T03。教学路线不</text>
