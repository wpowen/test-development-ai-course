{
  "schema_version": "ai-tevv-coverage-matrix.v1",
  "status": "TEMPLATE_NOT_RUN",
  "purpose": "Reusable TEVV planning matrix. A cell is planning evidence, never evidence that the represented system was tested.",
  "framework_functions": ["GOVERN", "MAP", "MEASURE", "MANAGE"],
  "lifecycle_stages": ["DEFINE", "BUILD", "EVALUATE", "RELEASE", "OPERATE"],
  "system_layers": ["MODEL", "RETRIEVAL", "TOOL", "APPLICATION", "HUMAN_DECISION"],
  "quality_dimensions": ["SAFETY", "QUALITY", "COST", "FAIRNESS", "PRIVACY"],
  "cell_contract": ["risk", "scenario", "oracle", "data", "owner", "evidence", "monitor", "rollback"],
  "completion_rule": "Every framework-function × system-layer cell must name all lifecycle stages and the eight contract fields. A non-applicable cell must say N/A with justification; missing evidence must say BLOCKED or NOT_RUN.",
  "cells": [
    {"framework":"GOVERN","layer":"MODEL","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"unapproved model/version or residual risk","scenario":"model change enters a release candidate","oracle":"approved model card, risk owner and change record","data":"model/version/parameter manifest","owner":"AI quality owner","evidence":"change receipt; NOT_RUN until signed","monitor":"version drift alert","rollback":"pin approved prior version"},
    {"framework":"GOVERN","layer":"RETRIEVAL","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"unowned corpus or access policy","scenario":"corpus/index refresh","oracle":"corpus owner, retention and ACL policy","data":"corpus/index/ACL manifest","owner":"knowledge owner","evidence":"governance receipt; NOT_RUN until reviewed","monitor":"freshness and ACL exception queue","rollback":"restore approved corpus/index"},
    {"framework":"GOVERN","layer":"TOOL","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"tool has unapproved authority or irreversible side effect","scenario":"new tool or scope is enabled","oracle":"least-privilege policy and accountable approver","data":"tool schema/scope/side-effect inventory","owner":"service and security owners","evidence":"approval and sandbox receipt; NOT_RUN until executed","monitor":"denied-call and policy-change alerts","rollback":"revoke scope and disable tool"},
    {"framework":"GOVERN","layer":"APPLICATION","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"business policy is replaced by prompt convention","scenario":"application/prompt workflow changes","oracle":"versioned business invariant and release authority","data":"requirements, prompt, policy and trace versions","owner":"product policy owner","evidence":"decision record; NOT_RUN until approved","monitor":"policy-violation trend","rollback":"revert application/policy bundle"},
    {"framework":"GOVERN","layer":"HUMAN_DECISION","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"human approval is absent, unqualified or rubber-stamped","scenario":"waiver, high-risk action or launch decision","oracle":"named authority, conflict declaration and decision log","data":"approval scope and reviewer record","owner":"accountable business owner","evidence":"attested approval receipt; NOT_RUN until supplied","monitor":"waiver expiry and override frequency","rollback":"withdraw approval and route to safe queue"},
    {"framework":"MAP","layer":"MODEL","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"task distribution and vulnerable slices are unknown","scenario":"representative evaluation design","oracle":"documented task, harm and slice map","data":"de-identified task/slice inventory","owner":"domain and AI quality owners","evidence":"dataset card; NOT_RUN until sampled","monitor":"slice coverage drift","rollback":"pause scope expansion"},
    {"framework":"MAP","layer":"RETRIEVAL","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"missing, stale or cross-tenant evidence","scenario":"query, corpus and permission mapping","oracle":"query-to-evidence and identity/tenant map","data":"query set, corpus snapshot and ACL labels","owner":"knowledge and privacy owners","evidence":"RAG mapping receipt; NOT_RUN until checked","monitor":"no-answer, stale-source and ACL rates","rollback":"remove corpus slice or disable retrieval"},
    {"framework":"MAP","layer":"TOOL","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"unsafe action path is not enumerated","scenario":"tool-call journey and failure mapping","oracle":"state-transition and authorization model","data":"tool schema, idempotency and failure cases","owner":"service owner","evidence":"threat/test-basis record; NOT_RUN until reviewed","monitor":"unknown-tool and invalid-parameter events","rollback":"read-only/sandbox mode"},
    {"framework":"MAP","layer":"APPLICATION","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"end-to-end boundary hides system interaction","scenario":"customer journey and fallback mapping","oracle":"risk register linked to acceptance criteria","data":"workflow, dependencies and incident taxonomy","owner":"product and test leads","evidence":"system-boundary map; NOT_RUN until validated","monitor":"handoff and failure-path completion","rollback":"fallback to non-AI workflow"},
    {"framework":"MAP","layer":"HUMAN_DECISION","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"automation changes who decides or bears harm","scenario":"human handoff and escalation design","oracle":"role/RACI and informed-review protocol","data":"decision queue, training and accessibility needs","owner":"business owner","evidence":"human-factors plan; NOT_RUN until observed","monitor":"override, delay and escalation distribution","rollback":"manual review only"},
    {"framework":"MEASURE","layer":"MODEL","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"quality claim rests on one score or uncalibrated Judge","scenario":"model response evaluation","oracle":"gold-set, independent scorer and blocker rules","data":"versioned inputs/outputs, slices and repetitions","owner":"evaluation owner","evidence":"run receipt; NOT_RUN until model calls occur","monitor":"score, refusal and drift by slice","rollback":"block promotion and pin baseline"},
    {"framework":"MEASURE","layer":"RETRIEVAL","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"retrieval failure is mistaken for generation failure","scenario":"retrieval and citation evaluation","oracle":"relevance labels, ACL assertions and claim-evidence checks","data":"query/gold evidence/ACL test set","owner":"RAG owner","evidence":"retrieval run receipt; NOT_RUN until executed","monitor":"recall, no-answer and citation-support slices","rollback":"disable affected index or retrieval path"},
    {"framework":"MEASURE","layer":"TOOL","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"correct final text conceals unsafe intermediate action","scenario":"trajectory and fault-injection evaluation","oracle":"authorization-before-action, idempotency and side-effect invariants","data":"tool-call trace and sandbox state","owner":"service/test owner","evidence":"sandbox trace receipt; NOT_RUN until executed","monitor":"denied, duplicate and unsafe-action attempts","rollback":"revoke write capability"},
    {"framework":"MEASURE","layer":"APPLICATION","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"overall average hides end-to-end blocker","scenario":"journey, latency and cost evaluation","oracle":"risk-slice metric cards and release gate","data":"paired baseline/current traces and cost data","owner":"quality owner","evidence":"integration receipt; NOT_RUN until executed","monitor":"SLO, error and cost by slice","rollback":"route to stable version"},
    {"framework":"MEASURE","layer":"HUMAN_DECISION","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"reviewers disagree or cannot detect unsafe output","scenario":"blind review and learner task assessment","oracle":"annotation rubric, agreement analysis and adjudication","data":"anonymized assignments and decision records","owner":"research lead","evidence":"practitioner/learner receipt; NOT_RUN until study runs","monitor":"agreement, completion time and error categories","rollback":"suspend automated decision use"},
    {"framework":"MANAGE","layer":"MODEL","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"measured degradation has no response","scenario":"model regression or provider change","oracle":"pre-registered threshold policy and escalation","data":"version-diff and monitor events","owner":"AI quality owner","evidence":"response/rollback receipt; NOT_RUN until event","monitor":"version and risk-slice alarms","rollback":"pin/revert model and reopen validation"},
    {"framework":"MANAGE","layer":"RETRIEVAL","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"stale/private source remains available","scenario":"freshness, deletion or permission incident","oracle":"expiry, deletion and ACL enforcement policy","data":"source lineage and access logs","owner":"knowledge/privacy owners","evidence":"incident receipt; NOT_RUN until event","monitor":"staleness, deletion SLA and ACL alarms","rollback":"withdraw index snapshot"},
    {"framework":"MANAGE","layer":"TOOL","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"unsafe tool action persists after detection","scenario":"policy violation or dependency outage","oracle":"kill switch, compensating action and incident runbook","data":"audit log, idempotency and compensation state","owner":"service/security owners","evidence":"gameday/incident receipt; NOT_RUN until run","monitor":"write attempts, retries and policy denials","rollback":"disable tool and execute compensation"},
    {"framework":"MANAGE","layer":"APPLICATION","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"release or waiver outlives its evidence","scenario":"threshold breach or waiver expiry","oracle":"time-bounded waiver and release decision policy","data":"release receipt, metric card and waiver register","owner":"release owner","evidence":"release receipt; NOT_RUN until authorised","monitor":"gate, waiver and incident trend","rollback":"rollback application release"},
    {"framework":"MANAGE","layer":"HUMAN_DECISION","lifecycle_stages":["DEFINE","BUILD","EVALUATE","RELEASE","OPERATE"],"risk":"human decisions are not auditable or equitable","scenario":"appeal, override or policy conflict","oracle":"appeal path, conflict handling and accountable decision record","data":"decision/appeal log and slice outcomes","owner":"governance owner","evidence":"governance review receipt; NOT_RUN until held","monitor":"appeal outcome and override disparity","rollback":"pause automation and convene review"}
  ]
}
